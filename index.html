<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ethics study games for Unit 1 (foundations and moral language), Unit 2 (virtue ethics), and Unit 3 (normative theories): drills, quizzes, case study practice, pitch practice, and Class Jeopardy.">
<title>Ethics Study Lab</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Spectral:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a study hall. Home is a test map (what each section is worth) feeding into seven practice stations; every station is a single focused column with the four theories color-coded throughout. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --sunk:#e3e7ec; --ink:#16202b; --muted:#566373; --line:#d2d9e1;
  --accent:#1f4e79; --accent-ink:#ffffff;
  --ve:#4b7a26; --sct:#a5432c; --deon:#2b5ea8; --util:#a8730c; --gen:#5e6876;
  --good:#2f7d4a; --bad:#b23a2a;
  --pru:#24708a; --jus:#8b3a6f; --tem:#3b7a44; --for:#b4561a;
  --display:"Spectral",Georgia,"Times New Roman",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151b; --surface:#1a2029; --sunk:#232b36; --ink:#e7ecf1; --muted:#9ba7b5; --line:#2e3845;
  --accent:#8fb9e6; --accent-ink:#0e1620;
  --ve:#9cc874; --sct:#ec8a72; --deon:#8bb2f2; --util:#e6b552; --gen:#a7b0bc;
  --good:#7fd29a; --bad:#f08977; --pru:#73bfd9; --jus:#e195c6; --tem:#8fcf8a; --for:#f0a06a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#1a2029; --sunk:#232b36; --ink:#e7ecf1; --muted:#9ba7b5; --line:#2e3845;
  --accent:#8fb9e6; --accent-ink:#0e1620;
  --ve:#9cc874; --sct:#ec8a72; --deon:#8bb2f2; --util:#e6b552; --gen:#a7b0bc;
  --good:#7fd29a; --bad:#f08977; --pru:#73bfd9; --jus:#e195c6; --tem:#8fcf8a; --for:#f0a06a; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.shell{max-width:980px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}

/* Top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;text-decoration:none;color:var(--ink);letter-spacing:.01em}
.brand small{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.home-link{font-weight:700;font-size:15px;text-decoration:none;color:var(--accent)}
.home-link:hover{text-decoration:underline}

/* Buttons and chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:16px;border-radius:8px;padding:10px 16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{font-size:14px;padding:6px 11px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--gen))}
.chip::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.t-ve{--c:var(--ve)} .t-sct{--c:var(--sct)} .t-deon{--c:var(--deon)} .t-util{--c:var(--util)} .t-gen{--c:var(--gen)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font-size:14px;font-weight:700;border-radius:999px;padding:6px 12px;border:1.5px solid var(--line);background:transparent;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--c,var(--accent));color:var(--c,var(--accent));background:var(--surface)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:grid;gap:16px}
.view-head{display:grid;gap:6px;margin-bottom:20px}
.view-head h1{font-size:clamp(30px,5vw,44px);font-weight:800}
.view-head p{color:var(--muted);max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.num{font-variant-numeric:tabular-nums}

/* Home */
.hero{display:grid;gap:10px;padding-block:8px 24px}
.hero h1{font-size:clamp(38px,7vw,68px);font-weight:800;letter-spacing:-.01em}
.hero p{font-size:19px;color:var(--muted);max-width:56ch}
.theories{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:4px}
.testmap{overflow-x:auto;margin-bottom:28px}
.testmap table{width:100%;min-width:560px;border-collapse:collapse;font-size:15px}
.testmap th,.testmap td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.testmap th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.testmap td.pts{font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap}
.testmap tfoot td{border-bottom:none;font-weight:700}
.testmap a{color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap}
.testmap a:hover{text-decoration:underline}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.station{display:grid;grid-template-rows:auto 1fr auto;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.station:hover{border-color:var(--accent);transform:translateY(-2px)}
.station h2{font-size:24px;font-weight:700}
.station p{font-size:15px;color:var(--muted)}
.station .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted);padding-top:8px;border-top:1px dashed var(--line)}
.station .meta b{color:var(--accent)}
.section-title{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.mode-tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Flashcards */
.card3d{perspective:1400px}
.flash{width:100%;min-height:300px;border:none;background:transparent;padding:0;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);display:grid}
.flash.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c,var(--gen));border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .term{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,52px);line-height:1.05}
.face .def{font-size:clamp(18px,2.4vw,22px);max-width:46ch;line-height:1.5}
.face .tap{font-size:13px;color:var(--muted)}
.known-mark{font-size:13px;font-weight:700;color:var(--good)}
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s}

/* Quiz / Sort / Mean */
.q-text{font-family:var(--display);font-weight:700;font-size:clamp(22px,3.4vw,30px);line-height:1.25}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;font-size:17px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:0 0 auto;font-weight:700;color:var(--muted);width:1.3em}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.opt.dim{opacity:.55}
.feedback{border-left:4px solid var(--good);padding:10px 14px;background:var(--sunk);border-radius:0 8px 8px 0}
.feedback.no{border-left-color:var(--bad)}
.feedback b{display:block;margin-bottom:2px}
.scorebig{font-family:var(--display);font-weight:800;font-size:clamp(56px,11vw,96px);line-height:1}
.missed{display:grid;gap:10px}
.missed li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.missed ul,ul.clean{list-style:none;margin:0;padding:0}
.theory-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.theory-btns button{border:1.5px solid var(--c);color:var(--c);background:var(--surface);border-radius:10px;padding:16px 10px;font-weight:700;font-size:17px}
.theory-btns button:hover:not(:disabled){background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.theory-btns button.hit{background:var(--c);color:var(--surface)}
.theory-btns button:disabled{cursor:default}
.prompt-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px 22px;text-align:center;display:grid;gap:10px}
.prompt-card .big{font-family:var(--display);font-weight:700;font-size:clamp(24px,4vw,36px);line-height:1.2}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;font-weight:700;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}

.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{border:1.5px dashed var(--line);border-radius:10px;padding:12px 10px;text-align:center;display:grid;gap:4px;min-height:84px;align-content:center}
.slot.active{border-color:var(--accent);border-style:solid}
.slot.filled{border-style:solid;background:var(--surface)}
.slot.ok{border-color:var(--good)} .slot.no{border-color:var(--bad)}
.slot .lab{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.slot .val{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15}
.slot .fix{font-size:13px;color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pool button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700}
.pool button:hover:not(:disabled){border-color:var(--accent)}
.pool button:disabled{opacity:.3;cursor:default}

/* Writing practice */
label.fl{display:grid;gap:6px;font-weight:700;font-size:15px}
textarea,input[type=text],input[type=number],select{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent)}
.model{display:grid;gap:12px}
.model-part{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.model-part .pt{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;color:var(--accent);grid-row:span 2}
.model-part h3{font-family:var(--body);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:16px;cursor:pointer}
.checks input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.idea-list{display:flex;flex-wrap:wrap;gap:6px}
.idea-list button{font-size:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;text-align:left}
.idea-list button[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.idea-list button .d{color:var(--good);font-weight:700;margin-left:4px}

/* Case lab */
.case-text{font-size:19px;line-height:1.6;max-width:66ch}
.stance{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--c);color:var(--c);border-radius:10px;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.5vw,30px)}
.stance-wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lens{display:grid;gap:4px;padding:12px 14px;border-left:4px solid var(--c);background:var(--sunk);border-radius:0 8px 8px 0}
.lens.mine{background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.lens h3{font-family:var(--body);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.group-list{display:grid;gap:8px}
.group-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px}
.group-row b{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tabs{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.tabs button{border:none;background:transparent;padding:8px 14px;font-weight:700;font-size:15px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Describe it */
.timer{font-family:var(--display);font-weight:800;font-size:clamp(44px,8vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.taboo{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.taboo span{font-weight:700;font-size:15px;padding:4px 10px;border-radius:6px;background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad);text-decoration:line-through}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.team-box{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.team-box.up{border-color:var(--accent)}
.team-box .s{font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.team-box input{min-width:0;width:100%;border:none;padding:0;background:transparent;font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-radius:0;border-bottom:1px dashed var(--line)}

@media (max-width:480px){.brand small{display:none}}
/* Trial gates */
.lockico{vertical-align:-2px;flex:0 0 auto}
.lockpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px}
.lockcard{border-style:dashed;border-top-style:solid}
.lockcard input,.lockcard textarea{background:var(--bg)}
.miss{color:var(--bad);font-size:15px}
.vwrap{display:grid;gap:10px;align-content:start;min-width:0}
.yournotes{background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1px solid var(--line);border-left:4px solid var(--c);border-radius:0 12px 12px 0;padding:12px 14px;display:grid;gap:6px;font-size:15px}
.wcount{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.wcount.ok{color:var(--good)}
.wlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.wlist li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--sunk);border-radius:8px}
.wlist li.ok{color:var(--good)}
.wlist li span:first-child{font-weight:700;color:var(--ink)}
.unlocked-tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.toggle.sm{font-size:13px}
.toggle.sm input{width:16px;height:16px}
.guess textarea{min-height:64px}
.trial-tag{font-size:13px!important;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)!important}
.tk-on{font-size:13px;color:var(--muted);margin:18px 0 0}
.linkbtn{background:none;border:none;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.tk-panel{max-width:520px;margin:40px auto}
.tk-panel a.btn{text-decoration:none}
.teacher-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:15px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.teacher-row summary{cursor:pointer;font-weight:700}
.teacher-row .row{margin-top:8px;align-items:flex-end}
.teacher-row input{max-width:220px}
/* Unit 1 */
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.u1c{--c:var(--accent)}
.u1face{border-top-color:var(--accent)}
.core-tag{display:inline-block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:2px 8px;vertical-align:middle}
.returns{display:block;font-size:14px;color:var(--muted);margin-top:6px;font-weight:700}
.glossary{display:grid;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.glossary > div{display:grid;grid-template-columns:minmax(140px,230px) minmax(0,1fr);gap:6px 18px;padding:12px 16px;border-bottom:1px solid var(--line)}
.glossary > div:last-child{border-bottom:none}
.glossary dt{font-weight:700;font-family:var(--display);font-size:18px}
.glossary dd{margin:0;font-size:16px}
.toggle{display:inline-flex;gap:8px;align-items:center;font-weight:700;font-size:15px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.defq{margin:0;padding:12px 16px;border-left:4px solid var(--accent);background:var(--sunk);border-radius:0 8px 8px 0;font-size:18px}
.view-head .formula{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.6vw,24px);color:var(--accent)}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.calc-row > div:first-child{display:grid;gap:2px;min-width:0}
.calc-row.total{border:1.5px solid var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 10px;font-weight:700;font-size:15px}
.seg button:hover:not(:disabled){border-color:var(--accent)}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.seg button.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--ink)}
.seg button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--ink)}
.seg button:disabled{cursor:default}
.seg.rub{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.rub button{display:grid;gap:2px;text-align:left;font-weight:400;font-size:13px;align-content:start;line-height:1.35}
.seg.rub button b{font-size:15px}
.rub-row{display:grid;gap:6px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.testlist{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted);font-size:15px}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(52px,10vw,84px);line-height:1}
.zone-good{color:var(--good)} .zone-warn{color:var(--util)} .zone-bad{color:var(--bad)}
.zone-label{font-weight:700}

<script>
/* ================= CONTENT ================= */
const TH = {
  ve:{name:"Virtue Ethics", short:"Virtue"},
  sct:{name:"Social Contract", short:"Social Contract"},
  deon:{name:"Deontology", short:"Deontology"},
  util:{name:"Utilitarianism", short:"Utilitarian"},
  gen:{name:"Across theories", short:"General"}
};

const TERMS = [
  {t:"Anarchy",th:"sct",d:"The absence of any government or political authority. Social contract thinkers see it as close to the state of nature.",x:["government","chaos","rules"]},
  {t:"Cardinal Virtue",th:"ve",d:"One of the four guiding virtues (prudence, justice, fortitude, temperance) that guide all the other moral virtues.",x:["four","guiding","prudence"]},
  {t:"Deon / Duty",th:"deon",d:"Greek for “duty.” A moral obligation one has to others and society. Duty is not thoughtless obedience: we must rationally assent to it, and it holds us accountable to morality whatever the consequences.",x:["obligation","Kant","must"]},
  {t:"Deficiency",th:"ve",d:"The vice of having too little of a quality. Cowardice is a deficiency of courage.",x:["too little","lack","mean"]},
  {t:"Ends",th:"gen",d:"The goals or purposes an action aims at. Utilitarians judge acts by their ends (outcomes); Kant says persons are ends in themselves.",x:["goal","purpose","result"]},
  {t:"Excess",th:"ve",d:"The vice of having too much of a quality. Rashness is an excess of courage.",x:["too much","overdo","mean"]},
  {t:"Eudaimonia",th:"ve",d:"Fulfillment, flourishing, or happiness through the virtuous life. Aristotle calls it the highest human good.",x:["happiness","flourishing","Aristotle"]},
  {t:"Fortitude",th:"ve",d:"The cardinal virtue of facing challenges and difficulties well.",x:["courage","brave","strength"]},
  {t:"Free Will",th:"gen",d:"The ability to choose the good (Bill Mattison, drawing on freedom for excellence).",x:["choice","choose","freedom"]},
  {t:"General Will",th:"sct",d:"Rousseau’s term for the will of the people as one body: what they decide together, as a collective, for their society, aimed at the common good. Rousseau never fully clarifies what it looks like.",x:["Rousseau","people","common"]},
  {t:"Good Will",th:"deon",d:"For Kant, a will that acts from duty. It is the only thing good without qualification.",x:["Kant","duty","intention"]},
  {t:"Habit",th:"ve",d:"A stable disposition formed by repeated action. Virtues are good habits; vices are bad ones.",x:["repeat","practice","routine"]},
  {t:"Happiness (for Utilitarians)",th:"util",d:"Pleasure and the absence of pain. Utilitarians use happiness and pleasure interchangeably, and it is the one thing they say is good in itself. It is not the same as eudaimonia.",x:["pleasure","pain","Bentham"]},
  {t:"Human Agency",th:"gen",d:"A person’s capacity to act intentionally and make free choices that shape their own life and the world around them.",x:["act","choice","free"]},
  {t:"Human Dignity",th:"gen",d:"The inherent, co-equal value of all people.",x:["worth","value","respect"]},
  {t:"Human Nature",th:"gen",d:"The basic traits and tendencies all humans share. Our view of it decides what a social contract needs: Hobbes, purely self-interested and afraid of death; Locke, rational, free, and equal; Rousseau, free, peaceful, and good until society corrupts us.",x:["human","born","Hobbes"]},
  {t:"Inculcation",th:"ve",d:"Instilling virtues or values through repeated teaching, example, and practice.",x:["teach","instill","repeat"]},
  {t:"Inherent",th:"gen",d:"A permanent, unchanging, natural part of something (attached to its nature). Deontology holds that actions are inherently right or wrong.",x:["itself","natural","built-in"]},
  {t:"Intention",th:"deon",d:"The purpose or motive behind an action. For Kant, intention, not outcome, determines an act’s moral worth.",x:["motive","mean","purpose"]},
  {t:"Justice",th:"ve",d:"The cardinal virtue of giving each person what is due to them: a proportional equality (equity), not strict equality.",x:["fair","due","law"]},
  {t:"Maxim",th:"deon",d:"A general truth, rule, or fundamental principle: the rule behind an action (“When I need money, I will make a false promise”). Kant tests maxims with the categorical imperative.",x:["rule","principle","Kant"]},
  {t:"Means",th:"gen",d:"The action or tool used to reach an end.",x:["way","tool","how"]},
  {t:"Mere Means",th:"deon",d:"Treating a person only as a tool for your own goals, ignoring their own purposes and consent. Kant forbids it.",x:["use","tool","Kant"]},
  {t:"Pain",th:"util",d:"Things that do not feel good. Utilitarians aim to minimize pain.",x:["hurt","pleasure","suffering"]},
  {t:"Pleasure",th:"util",d:"Things that feel good. Utilitarians aim to maximize pleasure and use it interchangeably with happiness; Mill ranks higher (intellectual and moral) pleasures above lower (physical and sensual) ones.",x:["enjoy","happy","fun"]},
  {t:"Prudence",th:"ve",d:"Right deliberation in action: the cardinal virtue of practical wisdom, which guides the other virtues.",x:["wisdom","wise","reason"]},
  {t:"State of Nature / Original Position",th:"sct",d:"The imagined condition of people before government (Hobbes, Locke, Rousseau). Rawls’s original position imagines choosing society’s rules behind a “veil of ignorance.”",x:["government","before","Hobbes"]},
  {t:"Telos / Ultimate End",th:"ve",d:"The final purpose a thing is directed toward. For humans it is eudaimonia (Aristotle) or union with God (Aquinas).",x:["purpose","goal","end"]},
  {t:"Temperance",th:"ve",d:"The cardinal virtue of self-control: moderation of our pleasures, desires, and emotions.",x:["moderation","self-control","pleasure"]},
  {t:"Totalitarianism",th:"sct",d:"A system in which the state holds total authority and controls nearly every part of public and private life.",x:["control","dictator","total"]},
  {t:"Utility (to Utilitarians)",th:"util",d:"An action’s usefulness in producing pleasure or happiness and preventing pain.",x:["useful","happiness","Bentham"]},
  {t:"Vice",th:"ve",d:"A bad habit: too much (excess) or too little (deficiency) of a virtue. Augustine and Aquinas also call vice a privation (absence) of virtue.",x:["bad","habit","sin"]},
  {t:"Virtue",th:"ve",d:"A stable and effective disposition oriented toward right action (the good).",x:["good","habit","excellence"]},
  {t:"Categorical Imperative",th:"deon",d:"The rational tool by which a deontologist can determine what is truly moral. Kant: act only on a maxim you could will to become a universal law, and treat humanity always as an end, never merely as a means.",x:["Kant","universal","rule"]},
  {t:"Social Contract",th:"sct",d:"The means by which a government receives its legitimate authority. People give up some freedoms in exchange for security (Hobbes), protected rights (Locke), or the most freedom possible (Rousseau).",x:["agreement","government","Locke"]},
  {t:"Greatest Happiness Principle",th:"util",d:"An action is more (most) moral when it pursues the greatest amount of happiness for the most people for the longest amount of time.",x:["most","people","Mill"]},
  {t:"Doctrine of the Mean",th:"ve",d:"Aristotle’s teaching that each virtue lies between two vices, one of excess and one of deficiency.",x:["middle","Aristotle","balance"]},
  {t:"Double Effect",th:"ve",d:"Aquinas’s principle for judging an action that has both a good effect and a bad effect. The action is allowed only if it meets all four parts.",x:["Aquinas","two","side effect"]},
  {t:"Double Effect, Part 1: The Act",th:"ve",d:"The action must be morally good, or neutral, as to object, motive, and circumstances.",x:["good","neutral","action"]},
  {t:"Double Effect, Part 2: Intention",th:"ve",d:"The evil effect must not be directly intended, only tolerated.",x:["intend","want","tolerate"]},
  {t:"Double Effect, Part 3: Directness",th:"ve",d:"The good effect must be caused at least as directly as the bad effect.",x:["directly","cause","bad"]},
  {t:"Double Effect, Part 4: Proportionality",th:"ve",d:"The good effect must be proportionate to compensate for the bad effect.",x:["outweigh","balance","proportion"]},
  {t:"Deontology",th:"deon",d:"Literally “the study of duty.” An ethical system that believes moral and legal law should derive from the duties and obligations one has to others and society.",x:["duty","Kant","obligation"]},
  {t:"Consequentialism",th:"util",d:"Outcomes-based (consequences-based) morality, built in opposition to Kant and deontology. Its most popular version is utilitarianism.",x:["outcome","result","consequence"]},
  {t:"Utilitarianism",th:"util",d:"The best outcome for the most people for the longest amount of time. Founded by Bentham and developed by Mill.",x:["most","people","Bentham"]},
  {t:"Universal Law of Nature",th:"deon",d:"Kant’s chief principle for determining if an act meets the categorical imperative: could everyone act this way without contradiction?",x:["universal","Kant","everyone"]},
  {t:"Hedonic Calculus",th:"util",d:"Bentham’s way of measuring pleasure with seven elements: intensity, duration, certainty, propinquity (nearness), fecundity (chance of more pleasure), purity (chance of pain), and extent (how many people are affected).",x:["Bentham","measure","intensity"]}
];

const QUIZ = [
  {th:"ve",q:"Who is credited with founding virtue ethics?",o:["Aristotle","Immanuel Kant","Jeremy Bentham","Thomas Hobbes"],a:0,e:"Aristotle’s Nicomachean Ethics gives virtue ethics its systematic form, building on Socrates and Plato."},
  {th:"ve",q:"For Aristotle, happiness (eudaimonia) is best described as…",o:["Fulfillment, flourishing, or happiness through the virtuous life","The greatest amount of pleasure","Union with God after death","Getting whatever you desire"],a:0,e:"Eudaimonia comes through living virtuously over a whole life. It is not a passing feeling."},
  {th:"ve",q:"For Aquinas, perfect happiness is found in…",o:["Union with God (the beatific vision)","Political honor","Bodily pleasure","Eudaimonia in this life alone"],a:0,e:"Aquinas accepts Aristotle’s earthly happiness as imperfect; perfect happiness is the vision of God."},
  {th:"ve",q:"According to Aristotle, how are virtues formed?",o:["By habit: repeatedly doing virtuous acts","We are born with them","By memorizing moral rules","By obeying the law"],a:0,e:"“We become just by doing just acts, brave by doing brave acts.” Virtue is inculcated through practice."},
  {th:"ve",q:"Which of these is NOT one of the four cardinal virtues?",o:["Charity","Prudence","Justice","Temperance"],a:0,e:"Charity is a theological virtue (with faith and hope). The cardinal virtues are prudence, justice, fortitude, and temperance."},
  {th:"ve",q:"Which cardinal virtue guides all of the others?",o:["Prudence","Temperance","Fortitude","Justice"],a:0,e:"Prudence is right deliberation in action. It sets the mean for every other virtue."},
  {th:"ve",q:"In the Doctrine of the Mean, the deficiency of courage is…",o:["Cowardice","Rashness","Insensibility","Temperance"],a:0,e:"Cowardice (too little) and rashness (too much) are the two vices on either side of courage."},
  {th:"ve",q:"The excess of generosity is…",o:["Wastefulness (prodigality)","Stinginess","Magnificence","Justice"],a:0,e:"Stinginess is the deficiency; wastefulness is the excess."},
  {th:"ve",q:"Christian virtue ethics adds which virtues to the Greek list?",o:["Faith, hope, and charity","Prudence and justice","Honor, glory, and pride","Liberty, equality, and fraternity"],a:0,e:"The theological virtues come by grace and direct us to God. Christian thinkers also treat humility as a virtue, which Aristotle did not."},
  {th:"ve",q:"What is the relationship among the virtues?",o:["They are connected; you cannot fully have one without the others, and prudence unites them","They are completely independent","Only one virtue matters","They often contradict each other"],a:0,e:"This is the “unity of the virtues.” A brave person without prudence is just reckless."},
  {th:"ve",q:"Which is a basic requirement of Just War Theory for going to war?",o:["War must be a last resort","The war must be profitable","The enemy must surrender unconditionally","Civilians may be targeted if it ends the war sooner"],a:0,e:"Classic criteria include legitimate authority, just cause, right intention, and last resort; in war, civilians may never be directly targeted."},
  {th:"ve",q:"What is the basic moral calculus?",o:["Quality of action + intention + circumstances = moral culpability","Intensity + duration + extent = utility","Consent + rights + law = legitimacy","Pleasure − pain = moral worth"],a:0,e:"All three parts decide how morally responsible (culpable) a person is. A good intention cannot make a bad act good."},
  {th:"ve",q:"Under the principle of double effect, which condition must be met?",o:["The good effect must be caused at least as directly as the bad","The bad effect must be intended","The action may be wrong in itself if the result is good","The bad effect must outweigh the good"],a:0,e:"The four parts: (1) the action is morally good or neutral as to object, motive, and circumstances; (2) the evil effect is not directly intended, only tolerated; (3) the good effect is caused at least as directly as the bad; (4) the good is proportionate to compensate for the bad."},
  {th:"ve",q:"How would a virtue ethicist approach the trolley problem?",o:["Ask what justice owes the one and the five, and let prudence judge the particulars","Count the lives and choose the larger number","Apply a rule that can never be broken","Ask which choice the majority would consent to"],a:0,e:"Justice comes first: the one is owed not to be harmed, a stronger claim than the five’s claim to be rescued. The driver should steer toward the lesser injury, no one may push the man off the bridge, and the bystander case remains a real dilemma. A virtuous person grieves whatever they choose."},
  {th:"sct",q:"Who is usually credited with founding social contract theory?",o:["Thomas Hobbes","John Stuart Mill","Aristotle","Immanuel Kant"],a:0,e:"Hobbes’s Leviathan (1651). Locke and Rousseau are the other main thinkers."},
  {th:"sct",q:"What are Locke’s natural rights?",o:["Life, health, liberty, and property","Life, liberty, and the pursuit of happiness","Speech, religion, and assembly","Liberty, equality, and fraternity"],a:0,e:"Locke: “no one ought to harm another in his life, health, liberty or possessions.” Jefferson adapted the list in the Declaration of Independence."},
  {th:"sct",q:"Hobbes believed human nature is…",o:["Selfish and competitive, so life without government is “nasty, brutish, and short”","Naturally good but corrupted by society","Rational and generally peaceful","Directed toward eudaimonia"],a:0,e:"Hobbes’s grim view leads him to want a strong sovereign to keep the peace."},
  {th:"sct",q:"Rousseau believed human nature is…",o:["Naturally good, but corrupted by society and private property","Fundamentally selfish","Ruled entirely by pleasure and pain","Fallen and in need of an absolute ruler"],a:0,e:"For Rousseau the problem is a corrupt society, so the solution is a just community governed by the general will."},
  {th:"sct",q:"According to social contract theory, where does a government get its legitimacy?",o:["The consent of the governed","Divine right of kings","Military strength","Tradition"],a:0,e:"A government is legitimate because the people agree to it."},
  {th:"sct",q:"According to Locke, what may the people do if a government violates their natural rights?",o:["Resist and replace it","Nothing; they must always obey","Return to the state of nature permanently","Only petition the king"],a:0,e:"A government that breaks the contract loses its authority. This idea fueled the American Revolution."},
  {th:"sct",q:"Which form of government did Hobbes think best?",o:["An absolute sovereign (ideally a monarch)","Direct democracy","Limited, representative government","No government at all"],a:0,e:"Hobbes protects security, so he wants an all-powerful sovereign. Locke protects rights through representative government; Rousseau protects freedom through direct self-rule."},
  {th:"sct",q:"How does a person enter the social contract?",o:["You’re already in: by participating in society, your entry is presumed","By signing a written document at age 18","By being born into a noble family","By fighting in a revolution"],a:0,e:"Entry is presumed by participating in society, and it is extremely difficult to back out of the commitment."},
  {th:"sct",q:"Which is the clearest connection between the USA and social contract theory?",o:["The Declaration of Independence says governments derive “their just powers from the consent of the governed”","The U.S. has a king","The Constitution establishes a state religion","The U.S. began in a state of nature"],a:0,e:"The Declaration, natural rights, and “We the People” all reflect Locke’s ideas."},
  {th:"sct",q:"What is the purpose of Rawls’s “veil of ignorance”?",o:["To choose fair rules without knowing your own place in society","To hide the government from citizens","To prove that people are naturally selfish","To decide which pleasures are higher"],a:0,e:"If you don’t know whether you’ll be rich or poor, you’ll choose rules that are fair to everyone."},
  {th:"sct",q:"In A Letter Concerning Toleration, Locke argues the government should not force religious belief because…",o:["True belief cannot be coerced; caring for souls is not the state’s job","All religions are false","Religion causes anarchy","The general will decides religion"],a:0,e:"Locke separates the work of the state (protecting rights) from the care of souls."},
  {th:"sct",q:"To decide what the right social contract is, you first need a view of…",o:["Human nature and the state of nature","The hedonic calculus","The theological virtues","Perfect and imperfect duties"],a:0,e:"First consider human nature: what would people be like if left unhindered? Then consider your ultimate goal: what does society most need to provide (security, rights, freedom)?"},
  {th:"deon",q:"Who founded deontology?",o:["Immanuel Kant","John Locke","Jeremy Bentham","Thomas Aquinas"],a:0,e:"Kant is the “father of deontology.” Class reading: Fundamental Principles of the Metaphysics of Morals."},
  {th:"deon",q:"What matters most to a deontologist?",o:["Intentions, because they are fully in our control","Consequences, because they affect the most people","Pleasure, because it is the only good","Habits, because they form character"],a:0,e:"Outcomes depend on luck; only the will is truly ours. A good will acting from duty has moral worth."},
  {th:"deon",q:"A murderer asks where your friend is hiding. What does Kant say?",o:["You may not lie, even to protect your friend","Lie, since it saves a life","Lie only if no one will find out","Tell the truth only if the murderer is polite"],a:0,e:"Not lying is a perfect duty. If lying were universal, no one could trust anything said. You may stay silent, but not lie."},
  {th:"deon",q:"What makes the categorical imperative “categorical”?",o:["It binds unconditionally, no matter what you want","It only applies in certain categories of life","It depends on your goals","It changes with culture"],a:0,e:"It is “an objective, rationally necessary and unconditional principle that we must follow despite any natural desires we may have to the contrary.”"},
  {th:"deon",q:"Which is a PERFECT duty in Kant’s system?",o:["Do not make false promises","Develop your talents","Help others in need","Maximize happiness"],a:0,e:"Perfect duties, like never lying or making false promises, allow no exceptions. Imperfect duties, like helping others, leave room for when and how."},
  {th:"deon",q:"For Kant, what does it mean to act from duty?",o:["To do what is right because it is right, out of respect for the moral law","To do whatever produces the best results","To follow your feelings and inclinations","To do whatever makes you happy"],a:0,e:"Duty (deon) is a moral obligation that binds no matter the consequences. Only actions done from duty, not from inclination or for a reward, have moral worth."},
  {th:"deon",q:"What does it mean that a person is an “end in themselves”?",o:["They have inherent dignity and must never be used merely as a tool","They exist to make others happy","Their life has value only if it is useful","They are the end result of evolution"],a:0,e:"This is the humanity formulation of the categorical imperative."},
  {th:"deon",q:"What role does rationality play in deontology?",o:["Reason lets us know the moral law and give it to ourselves; it is the source of our dignity","Rationality is less important than feelings","Reason is used to calculate pleasure","Rationality is a habit formed by practice"],a:0,e:"Because rational beings are autonomous lawgivers, they have dignity rather than a price."},
  {th:"deon",q:"How does deontology relate to legal systems?",o:["Like good laws, moral duties are universal rules that bind everyone equally, whatever the outcome","Laws are only useful if they maximize pleasure","Laws are habits taught by parents","Legal systems are unnecessary for deontologists"],a:0,e:"Kant’s ethics looks like a moral law code: the same rule for all, grounded in reason, respecting persons as ends."},
  {th:"deon",q:"In the trolley problem, why does a deontologist refuse to push the large man off the bridge?",o:["Pushing him uses him as a mere means","It would produce less pleasure","It is not a habit","He did not consent to the social contract"],a:0,e:"Killing him is a means to stopping the trolley. Even if five are saved, you have used an innocent person as a tool."},
  {th:"util",q:"Who founded utilitarianism?",o:["Jeremy Bentham","John Locke","Immanuel Kant","Jean-Jacques Rousseau"],a:0,e:"Bentham built utilitarianism in opposition to Kant and to the governance he lived under, as a basis for reforming law. Mill developed it."},
  {th:"util",q:"Why was utilitarianism founded?",o:["To reform laws and society on a rational, measurable basis: the general welfare","To defend the divine right of kings","To explain the cardinal virtues","To prove humans are naturally good"],a:0,e:"Bentham wanted laws judged by their actual effects on human happiness, not tradition."},
  {th:"util",q:"What matters most to a utilitarian?",o:["Consequences, because results are what actually affect happiness","Intentions, because they show character","Duty, because it is universal","Consent, because it makes government legitimate"],a:0,e:"An act is right if it produces the greatest happiness. The motive doesn’t change the outcome."},
  {th:"util",q:"What does the Greatest Happiness Principle say?",o:["An action is most moral when it pursues the greatest happiness for the most people for the longest time","Always follow your duty","Virtue is the mean between extremes","Government needs the consent of the governed"],a:0,e:"Utilitarians weigh how much happiness an action brings, to how many people, and for how long."},
  {th:"util",q:"The key difference between Mill and Bentham is that Mill…",o:["Ranked pleasures by quality, not just quantity","Rejected pleasure as the good","Founded deontology","Said intentions matter most"],a:0,e:"Mill: “It is better to be a human being dissatisfied than a pig satisfied; better to be Socrates dissatisfied than a fool satisfied.” Bentham: “the game of push-pin is of equal value with … poetry.”"},
  {th:"util",q:"In Mill’s hierarchy of pleasures, which ranks highest?",o:["Intellectual and moral pleasures","Bodily pleasures","Pleasures of wealth","Pleasures of revenge"],a:0,e:"Anyone who has experienced both would prefer the higher pleasures."},
  {th:"util",q:"Which three criteria are central to the utilitarian calculus?",o:["Intensity, duration, and extent (number of people affected)","Quality of action, intention, and circumstances","Life, liberty, and property","Prudence, justice, and temperance"],a:0,e:"Bentham’s full hedonic calculus has seven elements: intensity, duration, certainty, propinquity (nearness), fecundity (chance of more pleasure), purity (chance of pain), and extent (how many people are affected)."},
  {th:"util",q:"How does a utilitarian weigh the happiness of one person against a group?",o:["Each person counts as one and no one as more than one, so the larger total wins","The individual always wins","Only the ruler’s happiness counts","Happiness cannot be compared"],a:0,e:"This is why critics worry utilitarianism can sacrifice individuals for the majority."},
  {th:"util",q:"What is a main utilitarian objection to deontology?",o:["Rigid rules can lead to terrible outcomes, like refusing to lie to save a life","It focuses too much on consequences","It ignores rules","It is based on pleasure"],a:0,e:"Utilitarians say a rule that makes the world worse should be broken."},
  {th:"util",q:"A bystander can pull a lever to turn a runaway trolley away from five people and onto one. What does a utilitarian do?",o:["Pull the lever: one death is better than five","Do nothing, because acting is wrong","Refuse, since it uses someone as a means","Ask for the consent of everyone involved"],a:0,e:"Five lives outweigh one. A strict utilitarian would push the large man too."},
  {th:"gen",q:"“Freedom for excellence” means…",o:["Freedom that grows as we practice virtue, like a pianist who can play anything","The ability to choose either option at random","Freedom from all laws","Freedom to maximize pleasure"],a:0,e:"Freedom of indifference is just the power to choose between options; freedom for excellence is the power to act well."},
  {th:"gen",q:"Equity differs from equality because equity…",o:["Gives each person what they need for a fair outcome","Gives everyone exactly the same thing","Ignores fairness","Applies only to money"],a:0,e:"Equality: same shoes for everyone. Equity: shoes that fit each person. Aristotle calls justice this kind of proportional equality."},
  {th:"gen",q:"According to Aquinas, a just law must be…",o:["An ordinance of reason for the common good, made by legitimate authority, and in harmony with natural law","Whatever the ruler commands","Whatever produces the most pleasure","Whatever the majority votes for"],a:0,e:"Aquinas calls an unjust law “a perversion of law,” echoing Augustine’s “an unjust law is no law at all.” Martin Luther King Jr. quoted both in his Letter from Birmingham Jail."},
  {th:"gen",q:"“The ends justify the means” best fits which theory?",o:["Utilitarianism","Deontology","Virtue ethics","Social contract theory"],a:0,e:"Utilitarians value outcomes (ends). Deontologists insist the means (the act itself) must be right."},
  {th:"gen",q:"Something with instrumental value is valued because…",o:["It is useful for getting something else","It is good in itself","It is required by duty","It is a virtue"],a:0,e:"Money is instrumental. Kant says human dignity is inherent, never merely instrumental."},
  {th:"gen",q:"In Philippa Foot’s original 1967 trolley case, why may the driver steer toward the one?",o:["Whichever track he takes, he injures someone, so he should do the least injury he can","The one person consented to the risk","The death of the one is intended as a means","Saving five always outweighs any duty"],a:0,e:"Foot calls this a conflict of negative duties. A bystander at a switch (Thomson’s later version) is different: doing nothing only lets the five die, so turning means harming an innocent to bring aid. That is why the bystander case is much harder."},
  {th:"sct",q:"Each social contract protects something different. Which matching is right?",o:["Hobbes: security; Locke: rights; Rousseau: freedom","Hobbes: freedom; Locke: security; Rousseau: rights","Hobbes: rights; Locke: freedom; Rousseau: security","All three: pleasure"],a:0,e:"Hobbes: forfeit rights to an absolute power for security. Locke: sacrifice limited rights to a representative government. Rousseau: keep maximum freedom through direct, group rule."},
  {th:"sct",q:"Which kind of government did Rousseau favor?",o:["Direct self-rule by the people (direct democracy)","An absolute monarch","Rule by a wealthy few","A theocracy"],a:0,e:"For Rousseau, the sovereignty of the people is the primary good, so the people should keep as much self-determination as possible."},
  {th:"deon",q:"Kant’s Universal Law of Nature is…",o:["The chief principle for determining if an act meets the categorical imperative","Aquinas’s list of the natural virtues","The rule that the strongest survive in the state of nature","Bentham’s method for measuring pleasure"],a:0,e:"Four steps: (1) create a rule for your planned action; (2) rewrite it as a universal law for all people; (3) ask whether that law is actually possible; (4) ask whether you are rationally compelled to follow it."},
  {th:"deon",q:"Which is one of the three questions for checking an action against the categorical imperative?",o:["Are people being treated as ends in themselves, not just means?","Will it produce the most pleasure?","Would the majority vote for it?","Does it fit the mean between two vices?"],a:0,e:"The three checks: Is it rational to expect everyone to be bound by this? Are people treated as ends, not just means? Is it done out of duty, not just desire?"},
  {th:"deon",q:"Kant separates acting “in conformity with duty” from acting “from duty.” Which has genuine moral worth?",o:["Acting from duty: doing right because it is right","Acting in conformity with duty, if the result is good","Both equally","Neither; only results matter"],a:0,e:"A shopkeeper who gives honest change only to protect his business acts in conformity with duty, but not from duty."},
  {th:"util",q:"Mill’s No Harm Principle says…",o:["We ought to be free to do anything that does not interfere with the freedom of others","Never cause anyone any pain","Avoid all lower pleasures","Government should stop every harmful choice"],a:0,e:"Mill joined utilitarianism to a strong defense of liberty, and backed reforms like universal education and women’s suffrage."},
  {th:"util",q:"Why do utilitarians judge by consequences instead of intentions?",o:["Outcomes are observable and can be measured; only the person truly knows their intentions","Consequences are inherently right or wrong","Good intentions always produce good outcomes","Duty requires it"],a:0,e:"They add that we already instinctively judge acts by their results. Nothing is intrinsically right or wrong; things are “instrumentally” right or wrong because of their outcomes."},
  {th:"util",q:"Bentham’s view that people are motivated by seeking pleasure and avoiding pain is called…",o:["Psychological egoism","Rational autonomy","The general will","Freedom for excellence"],a:0,e:"“Nature has placed mankind under the governance of two sovereign masters, pain and pleasure.”"},
  {th:"util",q:"According to the Ethics Explainer, who held that we should follow the rules that create the most happiness over time (rule utilitarianism)?",o:["John Stuart Mill","Jeremy Bentham","Immanuel Kant","Thomas Hobbes"],a:0,e:"Bentham is closer to act utilitarianism, judging each action’s outcome. Mill thought society needs rules, like speed limits, that produce the most happiness over time."},
  {th:"gen",q:"Judith Jarvis Thomson concluded that the trolley cases turn on the difference between…",o:["Deflecting a threat and bringing in a new threat","Higher and lower pleasures","Equality and equity","Express and implied consent"],a:0,e:"Turning the trolley deflects a threat already in motion; pushing the man brings a new threat to him. Thomson was a deontologist; Foot and Anscombe were virtue ethicists."},
  {th:"gen",q:"What do Philippa Foot and G.E.M. Anscombe have in common?",o:["Both were Oxford-educated virtue ethicists who debated double effect","Both founded utilitarianism","Both were social contract theorists","Both defended the categorical imperative"],a:0,e:"Foot, a secular virtue ethicist, questioned double effect in 1967. Anscombe, a Catholic virtue ethicist, responded."},
  {th:"gen",q:"A student says, “I was happiest last weekend at the concert.” Which theory would count that feeling as the happiness that matters most?",o:["Utilitarianism: happiness is pleasure, and pleasure can be added up","Virtue ethics: happiness is a single good feeling","Deontology: happiness is the reward for duty","Social contract theory: happiness is what government guarantees"],a:0,e:"For utilitarians, happiness is pleasure and the absence of pain. Eudaimonia is different: the fulfillment of a whole life lived virtuously, not a passing feeling."},
  {th:"deon",q:"Kant: “Morality is not the doctrine of how we may make ourselves happy, but how we may make ourselves worthy of happiness.” What does this show?",o:["For Kant, morality is about duty, not about pursuing our own fulfillment","Kant thinks happiness is the highest good","Kant measures morality by pleasure","Kant rejects reason as a guide"],a:0,e:"Deontology is not about the personal pursuit of happiness or fulfillment; acting from duty is what makes us worthy of happiness."},
  {th:"ve",q:"According to the Week 9 slides, what does prudence do for fortitude?",o:["It gives courage an accurate grasp of the danger","It removes all fear","It makes fortitude unnecessary","It tells fortitude to always attack"],a:0,e:"In return, fortitude empowers prudence to recognize truths it does not want to acknowledge. The cardinal virtues work together."},
  {th:"ve",q:"Aquinas: “The principal act of fortitude is to remain steadfast in the midst of dangers, rather than to attack.” Which part of fortitude is he stressing?",o:["Endurance","Attack","Rashness","Indifference"],a:0,e:"Endurance is the greater part of fortitude. Christian thinkers see martyrdom, love bearing all things even to death, as its ultimate form."},
  {th:"ve",q:"Aquinas writes that contemplation of God is imperfect now and “will be perfect in the life to come.” What does this add to Aristotle’s view of happiness?",o:["Perfect happiness lies beyond this life, in God","Happiness is just pleasure","Happiness depends only on wealth and honor","Nothing; they say exactly the same"],a:0,e:"Aristotle locates complete happiness in the activity of understanding in this life. Augustine: we live well by following God and happily by reaching him."},
  {th:"sct",q:"Which thinker has the most hopeful view of human nature and wants the least government?",o:["Rousseau","Hobbes","Locke","Bentham"],a:0,e:"Rousseau sees humanity as free and peaceful until society corrupts it, so he keeps as much freedom as possible. Hobbes is at the other extreme; Locke is close to Rousseau but a little more cautious."},
  {th:"sct",q:"A critic says, “I never agreed to any contract, and I can’t realistically leave.” Which theory is this aimed at?",o:["Social contract theory","Utilitarianism","Virtue ethics","Deontology"],a:0,e:"Critics also ask whether the contract is real or only a metaphor, and Carole Pateman argues the classic theories ignored the subordination of women."},
  {th:"deon",q:"A critic says, “Refusing to lie to a murderer, even to save your friend, is following a rule off a cliff.” Which theory is this aimed at?",o:["Deontology","Utilitarianism","Social contract theory","Virtue ethics"],a:0,e:"Deontology can seem inflexible when it ignores consequences. Some answer with threshold deontology: follow the rules except in emergencies."},
  {th:"util",q:"A critic says, “If five people would be happier, this theory lets them harm one innocent person.” Which theory is this aimed at?",o:["Utilitarianism","Deontology","Virtue ethics","Social contract theory"],a:0,e:"Critics also note that pleasures are hard to measure and compare, and ask where justice and individual rights fit."}
];

const IDEAS = [
  {k:"Categorical Imperative",th:"deon",d:"The rational tool by which a deontologist can determine what is truly moral.",e:"It is “an objective, rationally necessary and unconditional principle that we must follow despite any natural desires we may have to the contrary.” Kant: “Act only in accordance with that maxim through which you can at the same time will that it become a universal law,” and treat humanity always as an end, never merely as a means. Check an action with three questions: Is it rational to expect everyone to be bound by it? Are people treated as ends, not just means? Is it done out of duty, not just desire?",x:"A false promise to borrow money fails: if everyone did it, no one would believe promises, so the maxim contradicts itself."},
  {k:"Double Effect Theory",th:"ve",d:"Aquinas’s principle for judging an action that has both a good effect and a bad effect.",e:"Allowed only if all four parts are met: (1) the action is morally good or neutral as to object, motive, and circumstances; (2) the evil effect is not directly intended, only tolerated; (3) the good effect is caused at least as directly as the bad; (4) the good is proportionate to compensate for the bad.",x:"Killing an attacker in self-defense: the intention is to save your life; the attacker’s death is a side effect."},
  {k:"Equality vs. Equity",th:"gen",d:"Equality treats everyone the same; equity gives each person what they need for a fair outcome.",e:"Equality is identical treatment. Equity accounts for different starting points so everyone can reach the same goal. Both connect to justice as giving each their due, and Aristotle describes justice as proportional equality (equity) rather than strict equality.",x:"Equality: every student gets the same size shoes. Equity: every student gets shoes that fit."},
  {k:"Freedom for Excellence vs. Freedom of Indifference",th:"gen",d:"Two ways of understanding freedom.",e:"Freedom of indifference is the bare ability to choose between options, with no built-in direction. Freedom for excellence grows as we develop virtue: we become more able to do what is good.",x:"A beginner who can only bang piano keys has freedom of indifference. A trained pianist who can play anything has freedom for excellence."},
  {k:"Inherent vs. Instrumental Morality",th:"gen",d:"Whether an act is good or evil by its nature, or only by its outcome.",e:"Inherent morality (deontology, virtue ethics): an act’s rightness or wrongness belongs to the act itself, a permanent part of its nature. Instrumental morality (utilitarianism): nothing is intrinsically right or wrong; things are “instrumentally” right or wrong because of their outcomes.",x:"Telling the truth: Kant says it is right in itself; a utilitarian says it is right when it produces more happiness."},
  {k:"Perfect vs. Imperfect Duties",th:"deon",d:"Kant’s two kinds of duties.",e:"Duty is a moral obligation that binds no matter the consequences. Perfect duties must always be kept, with no exceptions (never lie). Imperfect duties must be pursued, but we have room to choose when and how (help others).",x:"Telling the truth and never keeping slaves are perfect duties; giving to people in need is an imperfect duty."},
  {k:"Religious Toleration",th:"sct",d:"The principle that government should not force religious belief.",e:"Locke (A Letter Concerning Toleration): state-sponsored religion is wrong, our natural state is toleration, and government shouldn’t interfere with matters of conscience, because true belief can’t be coerced. Rousseau also saw society as needing pluralism, above all in religion.",x:"The First Amendment’s ban on an established religion reflects this idea."},
  {k:"Social Contract",th:"sct",d:"The means by which a government receives its legitimate authority.",e:"Each thinker asks how much people should give up, and for what. Hobbes: forfeit rights to an absolute power for security. Locke: sacrifice limited rights to a representative government that protects natural rights. Rousseau: keep maximum freedom through direct, group rule. By participating in society, you’re already in.",x:"The Declaration of Independence: governments derive “their just powers from the consent of the governed.”"},
  {k:"State of Nature",th:"sct",d:"The imagined condition of humans before government.",e:"Hobbes: purely self-interested and afraid of death, a war of all against all. Locke: rational, free, and equal, but capable of doing wrong. Rousseau: free and peaceful, until society corrupts us by creating inequality. Each view decides what kind of government is needed.",x:"Hobbes says life there would be “solitary, poor, nasty, brutish, and short,” so he wants a strong sovereign."},
  {k:"The Doctrine of the Mean",th:"ve",d:"Aristotle’s teaching that every moral virtue is a mean between a vice of deficiency and a vice of excess.",e:"The mean is not a mathematical midpoint. Prudence finds the right amount, at the right time, toward the right person, for the right reason.",x:"Courage is the mean between cowardice (deficiency) and rashness (excess)."},
  {k:"The Greatest Happiness Principle",th:"util",d:"An action is more (most) moral when it pursues the greatest amount of happiness for the most people for the longest amount of time.",e:"Happiness means pleasure and the absence of pain. Utilitarians weigh how much happiness an action brings, to how many people, and for how long, counting everyone equally.",x:"A city builds a park instead of a private golf course because more people will benefit."},
  {k:"Human Dignity, Natural Law, and the Categorical Imperative",th:"deon",d:"Human dignity grounds the universal moral law, and reason works that law out: through natural law (Aquinas) or the categorical imperative (Kant).",e:"Every person has inherent, co-equal value. Because of that dignity there is a universal moral law that holds for everyone, and reason discovers it: Aquinas through natural law, Kant through the categorical imperative. So rational persons must be treated as ends, never merely as means.",x:"Neither allows harvesting one healthy patient’s organs to save five others."},
  {k:"Universal Law of Nature / Natural Law",th:"deon",d:"Moral law that holds for everyone, discoverable by reason.",e:"Kant’s Universal Law of Nature is the chief principle for determining if an act meets the categorical imperative: (1) create a rule for your planned action; (2) rewrite it as a universal law for all people; (3) ask whether that law is actually possible; (4) ask whether you would be rationally compelled to follow it. Aquinas’s natural law is our rational share in God’s eternal law, directing us toward our natural goods.",x:"Stealing fails the test: if everyone stole, the idea of property would collapse."},
  {k:"Views on Best Governments",th:"sct",d:"Each thinker’s ideal government follows from their view of human nature.",e:"Hobbes (protecting security): monarchy, dictatorship, or oligarchy, ideally an absolute sovereign. Locke (protecting rights): a republic or representative democracy, with the right to replace a government that violates rights. Rousseau (protecting freedom): direct democracy and direct self-rule, keeping as much freedom as possible. Aristotle: a mixed constitution (polity) aimed at the common good.",x:"On the class chart: Hobbes is at totalitarian government with humanity at its worst; Rousseau is near anarchy with humanity excellent; Locke is a little less optimistic than Rousseau and a little closer to the center on government, though still nearer anarchy. The United States chose Locke."},
  {k:"Views on Human Nature",th:"gen",d:"What people are like at bottom, which shapes every ethical and political theory.",e:"Hobbes: purely self-interested and scared of death and pain. Locke: rational, free, and equal, but capable of doing wrong. Rousseau: good by nature, but corrupted by society. Aristotle: a rational, political animal with a telos. Kant: rational and free. Bentham and Mill: we seek pleasure and avoid pain, with equal dignity and liberty.",x:"Because Hobbes thinks people are dangerous, he gives the sovereign almost unlimited power."},
  {k:"What Makes a Law Just?",th:"gen",d:"The standard a law must meet to bind us morally.",e:"Aquinas: a law must be an ordinance of reason, for the common good, made by legitimate authority, and promulgated; it must agree with natural law. Social contract: it must protect rights and rest on consent. Kant: it must be universalizable and respect persons.",x:"Martin Luther King Jr. called segregation laws unjust because they degraded human dignity."},
  {k:"Why Value Means or Ends",th:"gen",d:"Whether the morality of an act lies in how it is done or in what it achieves.",e:"Utilitarians value ends: outcomes decide right and wrong. Deontologists value means: some acts are forbidden even for good results. Virtue ethics focuses on the telos and the character the act forms.",x:"Lying to win an election: a utilitarian looks at the results; a Kantian says lying is wrong whatever the result."},
  {k:"Mill vs. Bentham",th:"util",d:"The two main utilitarians and how they differ.",e:"Bentham: pleasure is the primary good and any pleasure equals any other, measured by the hedonic calculus (intensity, duration, certainty, propinquity, fecundity, purity, extent). Mill: higher pleasures (intellectual and moral) outrank lower ones (physical and sensual), and we should be free to do anything that doesn’t interfere with others’ freedom (the No Harm Principle).",x:"Bentham: “the game of push-pin is of equal value with … poetry.” Mill: “better to be Socrates dissatisfied than a fool satisfied.”"},
  {k:"The Trolley Problem",th:"gen",d:"A thought experiment, first posed by Philippa Foot (1967), testing whether outcomes, means, or what we owe each person matters most.",e:"A runaway trolley will kill five unless it is turned onto a track where it will kill one. Who acts matters: Foot’s agent is the driver; Thomson’s is a bystander at a switch, and she concluded that deflecting a threat differs from bringing in a new threat. A utilitarian turns it either way and would also push a man off a bridge to stop it. A deontologist refuses to push, since that uses him as a mere means. A virtue ethicist asks what justice owes the one and the five and lets prudence judge the particulars: the driver should steer toward the lesser injury, no one may push the man, and the bystander case is a genuine dilemma; a virtuous person grieves whatever they choose.",x:"Double effect struggles here. In Thomson’s Loop case the one man’s body is what stops the trolley, so his death looks like a means, yet many still think turning is allowed."}
];

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---- Flashcards ---- */
V.flashcards = {
  init(){ S = { filter:"all", mode:"all", deck:[], pos:0, flipped:false }; this.build(); },
  build(){
    let idx = TERMS.map((t, i) => i).filter(i => S.filter === "all" || TERMS[i].th === S.filter);
    if (S.mode === "learning") idx = idx.filter(i => !P.known[TERMS[i].t]);
    S.deck = idx; S.pos = Math.min(S.pos, Math.max(0, idx.length - 1)); S.flipped = false;
  },
  render(){
    const n = S.deck.length;
    const knownIn = TERMS.filter(t => (S.filter === "all" || t.th === S.filter) && P.known[t.t]).length;
    const total = TERMS.filter(t => S.filter === "all" || t.th === S.filter).length;
    let card;
    if (!n) card = `<div class="prompt-card"><div class="big">You know every card in this set.</div><p class="muted">Switch to “All cards” to review, or pick another theory.</p></div>`;
    else {
      const t = TERMS[S.deck[S.pos]];
      card = `<div class="card3d"><button type="button" class="flash${S.flipped ? " flipped" : ""}" data-act="flip" aria-label="${S.flipped ? "Show term" : "Show definition"}">
        <div class="face t-${t.th}">${chip(t.th)}<div class="term">${esc(t.t)}</div>${P.known[t.t] ? `<span class="known-mark">✓ Known</span>` : ""}${gated() && GATES.flashGuess && cardOpen3(t) ? '<span class="unlocked-tag">Unlocked · flip anytime</span>' : ""}<span class="tap">Tap or press Space to flip</span></div>
        <div class="face back t-${t.th}"><span class="eyebrow">${esc(t.t)}</span><p class="def">${esc(t.d)}</p></div>
      </button></div>` + (gated() && GATES.flashGuess && !S.flipped && !cardOpen3(t) ? `<label class="fl guess" for="guess3">Write the definition from memory before you flip<textarea id="guess3" data-guess3="1" rows="2" placeholder="In your own words">${esc(S.guess || "")}</textarea></label>${S.flipMsg ? `<p class="miss" role="status">${esc(S.flipMsg)}</p>` : ""}`
        : S.flipped && S.wrote ? `<div class="feedback hint"><b>You wrote</b>${esc(S.wrote)}</div>` : "");
    }
    view.innerHTML = `
      <div class="view-head"><span class="eyebrow">Word Definitions · 12 pts</span><h1>Flashcards</h1>
        <p>Say the definition out loud before you flip. On the test, a 2-point definition needs the meaning plus which thinker or theory it belongs to.</p></div>
      <div class="stack">
        <div class="row between">${filterRow(S.filter)}
          <div class="tabs" role="group" aria-label="Which cards"><button type="button" data-act="mode" data-v="all" aria-pressed="${S.mode === "all"}">All cards</button><button type="button" data-act="mode" data-v="learning" aria-pressed="${S.mode === "learning"}">Still learning</button></div></div>
        <div class="stats"><span>Card <b>${n ? S.pos + 1 : 0}</b> of <b>${n}</b></span><span>Known <b>${knownIn}</b> / ${total}</span></div>
        <div class="progress" aria-hidden="true"><span style="width:${total ? knownIn / total * 100 : 0}%"></span></div>
        ${card}
        <div class="row between">
          <div class="row"><button class="btn" type="button" data-act="prev" ${n ? "" : "disabled"}>← Prev</button><button class="btn" type="button" data-act="shuffle" ${n > 1 ? "" : "disabled"}>Shuffle</button></div>
          <div class="row"><button class="btn" type="button" data-act="learning" ${n ? "" : "disabled"}>Still learning</button><button class="btn primary" type="button" data-act="know" ${n ? "" : "disabled"}>Know it →</button></div>
        </div>
        <button class="btn sm" type="button" data-act="resetknown" style="justify-self:start">Clear my “known” cards</button>
      </div>`;
  },
  next(){ if (S.deck.length) { S.pos = (S.pos + 1) % S.deck.length; S.flipped = false; S.guess = ""; S.wrote = ""; S.flipMsg = false; } },
  input(e){ if (e.target.dataset.guess3) { S.guess = e.target.value; if (S.flipMsg) { S.flipMsg = false; const m = view.querySelector(".guess + .miss"); if (m) m.remove(); } } },
  click(act, el){
    if (act === "flip" && !S.flipped) { const t = TERMS[S.deck[S.pos]];
      if (t && !cardOpen3(t)) {
        if (wc(S.guess) < GATES.flashMinWords) S.flipMsg = `Write at least ${GATES.flashMinWords} words first, then flip.`;
        else if (!relates3(t, S.guess)) S.flipMsg = `That doesn’t seem to connect to “${t.t}” yet. Write what you remember about it from class, then try again.`;
        else { P.flashOpen3 = P.flashOpen3 || {}; P.flashOpen3[t.t] = 1; saveP(); S.flipMsg = false; S.wrote = S.guess; S.flipped = true; this.render(); return; }
        this.render(); setTimeout(() => $("#guess3") && $("#guess3").focus(), 0); return; } }
    if (act === "filter") { S.filter = el.dataset.v; S.pos = 0; this.build(); }
    if (act === "mode") { S.mode = el.dataset.v; S.pos = 0; this.build(); }
    if (act === "flip") { S.flipped = !S.flipped; const f = view.querySelector(".flash"); f.classList.toggle("flipped", S.flipped); return; }
    if (act === "prev") { S.pos = (S.pos - 1 + S.deck.length) % S.deck.length; S.flipped = false; S.guess = ""; S.wrote = ""; S.flipMsg = false; }
    if (act === "shuffle") { S.deck = shuffle(S.deck); S.pos = 0; S.flipped = false; S.guess = ""; S.wrote = ""; }
    if (act === "know") { const t = TERMS[S.deck[S.pos]]; P.known[t.t] = 1; saveP();
      if (S.mode === "learning") { S.deck.splice(S.pos, 1); if (S.pos >= S.deck.length) S.pos = 0; S.flipped = false; } else this.next(); }
    if (act === "learning") { const t = TERMS[S.deck[S.pos]]; delete P.known[t.t]; saveP(); this.next(); }
    if (act === "resetknown") { if (el.dataset.armed) { P.known = {}; saveP(); this.build(); } else { el.dataset.armed = 1; el.textContent = "Click again to clear"; return; } }
    this.render();
  },
  key(e){
    if (e.key === " " || e.key === "Enter") { if (e.target.closest("button") && !e.target.closest(".flash")) return; e.preventDefault(); this.click("flip"); }
    if (e.key === "ArrowRight") { this.next(); this.render(); }
    if (e.key === "ArrowLeft") this.click("prev");
  }
};

V.quiz = {
  init(){ S = { stage:"setup", filter:"all", len:19, qs:[], i:0, picked:null, score:0, missed:[] }; },
  start(list){
    const pool = list || QUIZ.filter(q => S.filter === "all" || q.th === S.filter);
    const qs = shuffle(pool).slice(0, list ? pool.length : S.len === 0 ? pool.length : S.len)
      .map(q => { const order = shuffle(q.o.map((_, k) => k)); return { ...q, o: order.map(k => q.o[k]), a: order.indexOf(q.a) }; });
    Object.assign(S, { stage:"play", qs, i:0, picked:null, score:0, missed:[] });
  },
  render(){
    const head = `<div class="view-head"><span class="eyebrow">Multiple Choice · 19 pts</span><h1>Practice Quiz</h1>
      <p>Answer, then read the explanation. The “why” behind each answer is what helps on the short-answer section too.</p></div>`;
    if (S.stage === "setup") {
      const pool = QUIZ.filter(q => S.filter === "all" || q.th === S.filter).length;
      view.innerHTML = head + `<div class="panel stack">
        <div class="stack" style="gap:8px"><span class="eyebrow">Theory</span>${filterRow(S.filter)}</div>
        <div class="stack" style="gap:8px"><span class="eyebrow">Length</span>
          <div class="tabs" role="group" aria-label="Quiz length">${[[10,"10 questions"],[19,"19 (test length)"],[0,"All " + pool]].map(([v, l]) => `<button type="button" data-act="len" data-v="${v}" aria-pressed="${S.len === v}">${l}</button>`).join("")}</div></div>
        <div class="row between"><span class="muted">${P.quizBest ? "Your best so far: " + esc(P.quizBest) : pool + " questions in this set"}</span><button class="btn primary" type="button" data-act="start">Start quiz</button></div>
      </div>`;
      return;
    }
    if (S.stage === "done") {
      const n = S.qs.length, pct = Math.round(S.score / n * 100);
      view.innerHTML = head + `<div class="stack">
        <div class="panel stack" style="text-align:center;justify-items:center"><span class="eyebrow">Your score</span>
          <div class="scorebig num">${S.score}/${n}</div><p class="muted">${pct}% · ${pct >= 90 ? "Test-ready on this set." : pct >= 75 ? "Solid. Review the ones you missed." : "Go back over the explanations below, then try again."}</p>
          <div class="row" style="justify-content:center">${S.missed.length ? `<button class="btn primary" type="button" data-act="retry">Retry the ${S.missed.length} I missed</button>` : ""}<button class="btn" type="button" data-act="again">New quiz</button></div></div>
        ${S.missed.length ? `<h2 class="section-title">Review what you missed</h2><ul class="missed">${S.missed.map(q => `<li class="stack" style="gap:6px">${chip(q.th)}<b>${esc(q.q)}</b><span><span class="muted">Answer:</span> ${esc(q.o[q.a])}</span><span class="muted">${esc(q.e)}</span></li>`).join("")}</ul>` : ""}
      </div>`;
      return;
    }
    const q = S.qs[S.i], done = S.picked !== null;
    view.innerHTML = head + `<div class="stack">
      <div class="stats"><span>Question <b>${S.i + 1}</b> of <b>${S.qs.length}</b></span><span>Score <b>${S.score}</b></span></div>
      <div class="progress" aria-hidden="true"><span style="width:${(S.i + (done ? 1 : 0)) / S.qs.length * 100}%"></span></div>
      <div class="panel stack">${chip(q.th)}<p class="q-text">${esc(q.q)}</p>
        <div class="opts">${q.o.map((o, k) => {
          let cls = "opt";
          if (done) cls += k === q.a ? " right" : k === S.picked ? " wrong" : " dim";
          return `<button type="button" class="${cls}" data-act="pick" data-k="${k}" ${done ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`;
        }).join("")}</div>
        ${done ? `<div class="feedback${S.picked === q.a ? "" : " no"}" role="status"><b>${S.picked === q.a ? "Correct." : "Not quite. The answer is " + "ABCD"[q.a] + "."}</b>${esc(q.e)}</div>
        <div class="row end"><button class="btn primary" type="button" data-act="next">${S.i + 1 < S.qs.length ? "Next question →" : "See my score"}</button></div>` : ""}
      </div></div>`;
    if (done) view.querySelector('[data-act="next"]').focus();
  },
  click(act, el){
    if (act === "filter") S.filter = el.dataset.v;
    if (act === "len") S.len = +el.dataset.v;
    if (act === "start" || act === "again") { if (act === "again") { S.stage = "setup"; } else this.start(); }
    if (act === "retry") this.start(S.missed.map(m => QUIZ.find(q => q.q === m.q)));
    if (act === "pick" && S.picked === null) { S.picked = +el.dataset.k; const q = S.qs[S.i]; if (S.picked === q.a) S.score++; else S.missed.push(q); }
    if (act === "next") {
      if (S.i + 1 < S.qs.length) { S.i++; S.picked = null; }
      else { S.stage = "done"; P.quizRuns++; const pct = S.score / S.qs.length;
        const best = P.quizBest ? parseInt(P.quizBest) / 100 : -1;
        if (S.qs.length >= 10 && pct > best) P.quizBest = Math.round(pct * 100) + "%"; saveP(); }
    }
    this.render(); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  },
  key(e){
    if (S.stage !== "play" || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const k = "abcd1234".indexOf(e.key.toLowerCase());
    if (k >= 0 && S.picked === null) { const b = view.querySelector(`[data-k="${k % 4}"]`); if (b) this.click("pick", b); }
  }
};
