        sec:["Vaping","Sneaking off campus","Competing in the state semifinal"],
        st:["Maya","Jess","Riley","The freshman"],
        v:"Prudence, right deliberation in action, is needed in this case study. It provides a sense of the conscience as well as appropriate discernment that is needed here. Likewise, there is a need for justice, giving what is due. Justice offers the elements of right relationships and duties based upon different forms of relationships (i.e. personal, communal, institutional). Temperance, self-moderation of desires, pleasures, and emotions, is also important. Temperance reminds us to maintain a healthy balance of pursuing physical pleasures by placing rationality over appetites. Finally, fortitude, facing challenges well, is also needed. Fortitude helps us to endure or attack different challenges while making sure fear does not rule our lives.",
        a:["Maya needs all four virtues. Prudence helps her see truthfully: she saw Jess and Riley herself and Jess admitted it, so this is not a rumor, and the coach has asked the captains directly. Justice asks what she owes each person: honesty to her coach, fairness to the sophomore keeper and the rest of the team, and real friendship to Jess, which wants Jess to be good and not just happy. Temperance keeps her desire to win, and her wish to avoid a fight with her best friend, from overruling moral truth. Fortitude lets her take the right course of action before Saturday, even though it is hard.",

    h1:"Theo isn’t the only one affected by his phone. Who shares his room, pays for his school, and is responsible for his dorm?",

        st:["Theo","Omar","Theo’s parents","The dorm head","Theo’s followers and sponsor"],
        v:"Temperance, self-control and moderation of desires, pleasures, and emotions, is at the center of this case. Its key elements are the harmony of the soul and placing rationality over our desires; desire itself is good, but it must not displace more important goals. Prudence, right deliberation in action, is needed so Theo can see his situation truthfully and choose the best means to good goals. Justice, giving what is due, applies because Theo shares a room and a family, so his habits affect his right relationships with others. Fortitude, facing challenges and difficulties well, is needed to endure the loss of income and attention that change would bring.",
        a:["Theo needs temperance most. His desire for followers and the stream has displaced goals that matter more: sleep, school, and his health. Deleting the apps and feeling “lighter” shows he is at the stage of incontinence, aware the habit is wrong but still acting on it. Prudence asks him to see truthfully that C’s and falling asleep in chapel are the real cost. Justice requires him to give Omar a room where he can sleep before 6 a.m. practice, and to give his parents the honesty they are due, since they sacrifice for his education. Fortitude helps him endure losing $300 a month and some followers.",

  { id:"letters", t:"Two Acceptance Letters", tag:"Family",
    s:["Grace, a senior, has been admitted to two schools. Her dream school is a private university across the country, which would cost $38,000 a year after financial aid. Her state’s flagship university has offered her a full-tuition scholarship in its honors college.",
       "Her parents say they will “find a way” for the dream school, which would mean taking out a second mortgage on their house. Her younger brother is a freshman and will start college in four years. Grace wants to be a pediatrician, which means medical school, and medical school debt, after college.",
       "Her two best friends are going to the state school, and Grace honestly can’t tell whether she leans toward it for good reasons or because she is afraid of starting over somewhere new. The deposit deadline is May 1, nine days away."],
    h1:"Grace’s choice reaches beyond Grace. Who else will live with the cost of it, now and in four years?",
    h3:"What is Grace’s real goal, her telos here: a school, or a career as a pediatrician? How does prudence treat the schools if they are means to that end?",
    m:{ p:"Should Grace accept the full scholarship at the state honors college, or attend her dream school with a second mortgage?",
        sec:["Her parents’ finances and the second mortgage","Her brother’s college costs in four years","Future medical school debt","Whether fear of starting over is shaping her choice"],
        st:["Grace","Her parents","Her younger brother","Her friends"],
        v:"Prudence, right deliberation in action, is the main virtue in this decision. Its key elements are seeing truthfully, the role of conscience, and discerning how to achieve good desires. Justice, giving what is due, applies because her choice affects her right relationships with her parents and brother. Temperance, moderation of desires, pleasures, and emotions, helps her moderate both her desire for a dream school and her fear of a new place. Fortitude, facing challenges well, is needed whichever way she goes: to disappoint herself or her parents, or to start over somewhere new.",
        a:["Grace needs prudence above all. Her good desire is to become a pediatrician, and both schools are means to that end. Seeing truthfully means facing the numbers: $38,000 a year, a second mortgage, and medical school debt still to come. It also means honestly asking whether fear of starting over, rather than good reasons, is pulling her toward the state school. Justice reminds her that her parents’ offer is a gift and not something she is owed, and that her brother is owed a fair chance at college too. Temperance moderates her desire for the prestige of a “dream school.” Fortitude gives her courage to make the choice and live with it.",
           "Her parents show love and generosity, but they also need prudence to see their finances truthfully, including their son’s future, and fortitude to tell Grace honestly if the mortgage would strain the family.",
           "Her brother cannot speak in this decision, but justice still counts him. Grace’s friends should not decide it for her; leaning on them would be choosing comfort over prudence."],
        r:"Grace should accept the full scholarship at the state honors college. Prudence keeps her eyes on her telos: becoming a pediatrician. The honors college gets her there without debt that would follow her family for years. Justice to her parents and brother weighs against putting the family home at risk for a school’s name, and temperance moderates the desire for prestige. Some would argue that her parents freely offered and she only gets one shot at her dream. But the dream is to be a doctor, not to attend a particular school, and a generous offer does not make it prudent to accept. If, after honest reflection, fear were her only reason, she should talk it through again before May 1." } },

  { id:"peace", t:"Keeping the Peace", tag:"Relationships",
    s:["Jordan and Sam, both seniors, have been dating for ten months. Over the last few months Sam has started asking Jordan to share her location at all times, gets upset when she spends time with friends, and goes silent for a day or two when she doesn’t reply quickly.",
       "To “keep the peace,” Jordan has stopped going to Friday movie nights with her friends and dropped out of the school play. Her best friend, Ava, recently told her that Sam is “controlling” and that Jordan has “become a different person.”",
       "Jordan still cares about Sam and knows his parents are going through a difficult divorce. She is also afraid of being alone for the rest of senior year. Prom is in three weeks, and Sam has already bought the tickets."],
    h1:"Name the secondary issues hiding in the details: the play, Friday nights, Sam’s family, and the prom tickets.",
    h3:"Look back at the Virtue as Mean slides: love’s deficiency is selfishness and its excess is enablement. Where does “keeping the peace” fall?",
    m:{ p:"Should Jordan stay in her relationship with Sam?",
        sec:["Jordan giving up her friends and the school play","Sam’s family going through a divorce","Ava’s honesty and how Jordan receives it","The prom tickets"],
        st:["Jordan","Sam","Ava and Jordan’s friends"],
        v:"Fortitude, facing challenges and difficulties well, is central here. Its key elements are correct belief about what should be feared, our relationship to fear and hardship, and the choice between endurance and attack. Prudence, right deliberation in action, helps Jordan see truthfully what the relationship has become. Justice, giving what is due, applies to right relationship between Jordan and Sam and with her friends. Temperance, moderation of desires, pleasures, and emotions, applies to Sam’s jealousy and to Jordan’s fear and attachment.",
        a:["Jordan needs prudence to see truthfully: quitting the play and Friday nights is not peace, and Ava’s words that she has “become a different person” are evidence worth taking seriously. The telos of dating should be two people growing toward the good together. Fortitude needs correct belief about what to fear: being alone is a real fear, but losing who she is matters more. This calls for attack, an honest conversation, rather than enduring something that should not be endured. Justice means she owes Sam honesty and owes her friends the friendship she has let go. Temperance helps her moderate the fear and attachment that keep her silent.",
           "Sam lacks temperance in his emotions; jealousy and days of silence are emotions ruling him. His parents’ divorce explains some of this but does not excuse it. Tracking Jordan’s location does not give her what is due in a relationship: trust and freedom.",
           "Ava shows justice and fortitude by telling her friend a hard truth. She needs prudence in how she keeps saying it, so that Jordan hears care rather than harshness."],
        r:"Jordan should have an honest conversation with Sam now, naming the specific behaviors and asking for real change. If Sam will not change, she should end the relationship before prom, not after. In the Virtue as Mean slides, love sits between selfishness and enablement; staying silent to keep the peace is enablement, not love. Fortitude gives her the courage to act, and justice asks for honesty with both Sam and her friends. Some would argue that ending things during Sam’s parents’ divorce would be cruel. But Jordan can show mercy in how she speaks and still refuse to enable controlling behavior, and waiting until after prom would only avoid difficulty, not show kindness." } },

  { id:"council", t:"The Honor Council", tag:"School",
    s:["Elijah, a senior, sits on the student honor council. A junior, Marcus, has admitted taking $300 from the lacrosse team’s fundraiser cash box. He says he used it to pay for his younger sister’s prescription after his family’s insurance lapsed. He has already repaid $100 and offered to work off the rest.",
       "This is Marcus’s second honor offense; as a freshman he plagiarized an essay. The handbook says a second major offense “may result in dismissal.” Marcus is on full financial aid, so dismissal would also cost him his housing.",
       "The parents who ran the fundraiser are angry and want Marcus expelled. Elijah plays lacrosse with Marcus and likes him. The council votes tomorrow, and Elijah’s vote may decide the outcome."],
    h1:"Elijah’s friendship with Marcus is an issue in its own right. What else is at stake for the school community, not just Marcus?",
    h3:"Use the Week 8 key parts of justice: proportionality, right relationship, the common good, and mercy and redemption. Which apply to Marcus, and which to the parents?",
    m:{ p:"Should Elijah vote to recommend that Marcus be dismissed?",
        sec:["Elijah’s friendship with Marcus and his impartiality","The parents’ demand for expulsion","Marcus’s family situation and his sister’s prescription","Marcus’s first offense and what a proportional consequence looks like"],
        st:["Elijah","Marcus","Marcus’s sister and family","The lacrosse team and its parents","The honor council and the school community"],
        v:"Justice, giving what is due, is at the heart of this case. Its key elements are proportionality, right relationship, the common good, and mercy and redemption, with leniency and harshness as its vices. Prudence, right deliberation in action, helps Elijah see the whole situation truthfully. Fortitude, facing challenges well, is needed to vote for what is just under pressure. Temperance, moderation of desires, pleasures, and emotions, keeps both his affection for Marcus and the parents’ anger from deciding the case.",
        a:["Elijah’s main virtue is justice. The consequence should be proportional: Marcus stole $300, has repaid $100, and this is his second offense. Doing nothing would be leniency; dismissal, which also costs a student on aid his housing, may be harshness. Prudence means seeing both the theft and the reason for it, and disclosing his friendship to the council so his vote can be trusted. Temperance keeps his friendship and the parents’ anger from steering him. Fortitude lets him vote for what he believes is just even if teammates or parents are upset.",
           "Marcus failed in justice by taking what was not his and in prudence by not asking the school for help. But confessing, repaying $100, and offering to work off the rest are the beginning of redemption and of restoring right relationship.",
           "The parents are owed repayment and a real response, and their anger is understandable. Justice asks for proportion, not revenge, and temperance asks them to moderate their emotions. The school community’s common good needs both trust in its fundraisers and a council that can restore someone who has done wrong."],
        r:"Elijah should disclose his friendship with Marcus and then vote against dismissal, recommending a serious, restorative consequence instead: full repayment, service hours, suspension from lacrosse, and a clear final warning. This is proportional and leaves room for mercy and redemption while still treating the theft seriously, so it is not leniency. Some would argue that this is a second offense, the handbook allows dismissal, and going easy invites more theft. But the handbook says “may,” which leaves room for prudence. The consequence is costly and real, and dismissal would also punish his sister and family. The common good is served when wrongdoing is answered and the person is restored to right relationship." } },

  { id:"lab", t:"The Missing Data", tag:"Science",
    s:["Priya, 22, is a lab assistant in a university lab testing a new asthma medication. While preparing figures for a paper, she notices that her supervisor, Dr. Hale, removed three patients from the results. Their data made the drug look less effective, and there is no note explaining why they were removed.",
       "The paper is due to a journal in one week, and a large grant renewal depends on it. Priya is applying to medical school, and her application relies on a strong recommendation letter from Dr. Hale.",
       "When she mentions it to a postdoc, he shrugs: “Everyone cleans data. Don’t make this your problem.” The university has an anonymous research-integrity office. Priya is not certain the removal was improper; there could be a medical reason she doesn’t know about."],
    h1:"Who is affected by a published drug study besides the people in the lab?",
    h3:"Priya isn’t certain anything wrong happened. How does prudence (seeing truthfully) shape what fortitude asks of her first?",
    m:{ p:"What should Priya do about the patients removed from the study?",
        sec:["Her medical school recommendation letter","The lab’s grant renewal","The postdoc’s claim that “everyone cleans data”","Uncertainty about whether there was a medical reason"],
        st:["Priya","Dr. Hale","The postdoc and the lab team","Future patients who would take the drug","The university and the scientific community"],
        v:"Fortitude, facing challenges and difficulties well, is central: correct belief about what to fear, our relationship to fear and hardship, and the choice between attack and endurance. Prudence, right deliberation in action, applies through seeing truthfully and the role of conscience. Justice, giving what is due, applies to future patients, to science, and to Dr. Hale, who is owed a fair hearing. Temperance, moderation of desires, pleasures, and emotions, keeps her ambition and fear in check.",
        a:["Priya needs prudence first. She is not certain anything improper happened, so seeing truthfully means finding out whether there was a medical reason before accusing anyone, while still listening to her conscience. Justice: future patients are owed honest results about a drug they will take, and Dr. Hale is owed a fair hearing. Fortitude requires correct belief about what to fear: losing a letter is a real loss, but less serious than patients relying on false data. Here that means attack, asking directly, rather than quietly enduring. Temperance keeps her desire for medical school from overruling all of this.",
           "Dr. Hale owes justice to patients and to science, and the pressure of the grant tests his temperance. If the removal was not justified, his desire for funding has displaced a far more important goal.",
           "The postdoc shows a lack of fortitude and justice. “Everyone cleans data” is how vicious habits become normal in a community, and his advice puts the lab’s comfort ahead of what patients are due."],
        r:"Priya should ask Dr. Hale directly and respectfully why the three patients were removed and ask that the reason be documented in the paper. If there is no legitimate reason, she should report it to the research-integrity office, even if it costs her the recommendation letter. Asking first is prudence; acting on the answer is fortitude; and both serve justice to the patients who will rely on this study. Some would argue that she might be wrong and could ruin her career over a misunderstanding. But that is exactly why she asks first, which is courage guided by prudence rather than rashness. And a future doctor who stays silent about bad data for a drug would betray the very purpose of medicine." } },

  { id:"tradition", t:"The Tradition", tag:"Dorm life",
    s:["Every fall in Birch House, the seniors hold “Freshman Olympics” the night before the first home game. Freshmen wear costumes the seniors pick, eat spoonfuls of hot sauce, and sing the school fight song in the dining hall while seniors film it. The videos end up on a private account that the whole dorm follows. Seniors call it “the best night of the year” and point out that they all went through it as freshmen.",
       "This year, a freshman named Leo quietly told Ben, one of six senior proctors, that he has been dreading it and asked whether he has to go. The other five proctors want to keep the tradition exactly as it is and say “nobody actually gets hurt.” The dorm head, an adult, has never asked about it.",
       "Ben is also running for head proctor next semester, and the other proctors’ votes count heavily in that decision."],
    h1:"A tradition affects more than the people in the room. Think about the videos, the dorm head, and the freshmen who haven’t said anything.",
    h3:"A tradition is a community’s habit. What do the other proctors’ words “nobody actually gets hurt” and “we went through it too” reveal about their virtues?",
    m:{ p:"Should Ben try to stop or change Freshman Olympics?",
        sec:["The videos on a private account","Leo’s request to sit out","Ben’s head proctor election","The dorm head not knowing what happens"],
        st:["Ben","Leo and the other freshmen","The other senior proctors","The dorm head","The Birch House community"],
        v:"Fortitude, facing challenges and difficulties well, is central to Ben’s choice. Its key elements are correct belief about what to fear and the choice between attack and endurance. Justice, giving what is due, applies through right relationship in the dorm community and the dignity owed to each freshman. Prudence, right deliberation in action, helps Ben find the best means of changing things. Temperance, moderation of desires, pleasures, and emotions, applies to the seniors’ desire to relive their night and to Ben’s own desire to be liked and elected.",
        a:["Ben needs fortitude: speaking up may cost him the head proctor vote. That is a real risk, but correct belief tells him it is less important than freshmen being humiliated on camera. Justice means that, as a proctor, he owes the freshmen protection and dignity, owes the other proctors honesty, and owes the dorm head the truth if it comes to that. Prudence helps him find the best means, such as proposing a version of the night that keeps the fun and bonding without humiliation. Temperance moderates his own desire to be popular.",
           "The other proctors lack temperance: their desire to repeat “the best night of the year” is overruling reason. “We went through it too” shows how a community’s habit can become a vice, and “nobody actually gets hurt” ignores what Leo has told Ben, a failure of justice.",
           "Leo shows fortitude and prudence by going to a proctor he trusts. The dorm head owes the community justice through oversight, and prudence would have asked about the night long ago."],
        r:"Ben should propose that the proctors keep the night but drop the hot sauce, the filming, and any costume a freshman doesn’t choose, and make it opt-in. He should tell Leo that he does not have to take part. If the other proctors refuse, Ben should tell the dorm head before the night happens. This is justice to the freshmen, prudence in seeking change before going over anyone’s head, and fortitude in accepting the cost. Some would argue that it is harmless bonding and that freshmen who skip it will be left out. But bonding does not require humiliation, a filmed video lasts long after the night ends, and the greater the cost to Ben, the greater the fortitude his choice shows." } }
];

/* ================= UNIT 2 VIEWS ================= */
const vchip = k => { const v = VIRTUES.find(x => x.k === k); return `<span class="chip v-${k}">${esc(v.n)}</span>`; };
const unitSwitch = u => `<nav class="unit-switch" aria-label="Choose a unit">${[["u1","unit1","Unit 1","Foundations"],["u2","unit2","Unit 2","Virtue Ethics"],["u3","unit3","Unit 3","Normative Theories"]].map(([k, h, n, l]) => `<a href="#${h}" ${u === k ? 'aria-current="page"' : ""}><b>${n}</b> ${l}</a>`).join("")}</nav>`;

function virtueCard(v){
  return `<article class="vcard v-${v.k}">
    <div class="vcard-head"><h2>${esc(v.n)}</h2><p class="vdef">${esc(v.d)}</p></div>
    <div class="stack" style="gap:6px"><span class="eyebrow">Essential characteristics</span>
      <ul class="charlist">${v.ch.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
    <div class="meanrow" aria-label="The mean">
      <div><span class="lab">Deficiency</span><b>${esc(v.lo)}</b></div>
      <div class="mid"><span class="lab">Virtue</span><b>${esc(v.n)}</b></div>
      <div><span class="lab">Excess</span><b>${esc(v.hi)}</b></div></div>
    <ul class="more">${v.more.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
    <div class="voices">${v.voices.map(([w, q]) => `<p><span class="who">${esc(w)}</span> ${esc(q)}</p>`).join("")}</div>
    <p class="role"><span class="eyebrow">With the other virtues</span>${esc(v.role)}</p>
  </article>`;
}
function quickRef(){
  return `<details class="quickref"><summary>Quick reference: the four cardinal virtues</summary>
    <div class="qr-grid">${VIRTUES.map(v => `<div class="qr v-${v.k}"><b>${esc(v.n)}</b><span>${esc(v.d)}</span><small>${v.ch.map(esc).join(" · ")}</small><small class="muted">${esc(v.lo)} ← → ${esc(v.hi)}</small></div>`).join("")}</div>
    <p class="muted" style="margin-top:8px">Full notes are in the <a href="#toolkit">Virtue Toolkit</a>.</p></details>`;
}
function modelStep(c, n){
  const m = c.m;
  if (n === 1) return `<p><b>Primary issue:</b> ${esc(m.p)}</p>
    <p><b>Secondary issues</b></p><ul>${m.sec.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <p><b>Key stakeholders</b></p><ul>${m.st.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  if (n === 2) return `<p>${esc(m.v)}</p>`;
  if (n === 3) return m.a.map(p => `<p>${esc(p)}</p>`).join("");
  return `<p>${esc(m.r)}</p>`;
}
const modelLabel = c => c.teacher ? "Teacher’s sample answer" : "Model answer";
function caseCard(c, open = true){
  return `<details class="case-card panel" ${open ? "open" : ""}><summary><span class="eyebrow">${esc(c.tag)} · Case ${VCASES.indexOf(c) + 1} of ${VCASES.length}</span><h2>${esc(c.t)}</h2></summary>
    <div class="case-body">${c.s.map(p => `<p>${esc(p)}</p>`).join("")}</div></details>`;
}

/* ---- Unit 2 home ---- */
V.home2 = {
  render(){
    const done = Object.keys(P.u2done || {}).length;
    view.innerHTML = unitSwitch("u2") + `
      <section class="hero">
        <span class="eyebrow">Unit 2 · Virtue Ethics</span>
        <h1>Analyze a case like a virtue ethicist.</h1>
        <p>Lock in the four definitions and the elements of each cardinal virtue, then put them to work on practice case studies written at blue book length.</p>
        <div class="theories">${VIRTUES.map(v => vchip(v.k)).join("")}</div>
      </section>
      <h2 class="section-title">The four-step method</h2>
      <ol class="method">${STEPS.map(s => `<li><span class="num">${s.n}</span><div><b>${esc(s.t)}</b><span>${esc(s.q.join(" · "))}</span></div></li>`).join("")}</ol>
      <h2 class="section-title">Study stations</h2>
      <div class="stations">
        ${station("vlab","Virtue Case Lab","Solo, pairs, or timed","Work through a case one step at a time, practice with a partner, or write a timed blue book answer. Then compare with the model.", `<span><b>${done}</b> / ${VCASES.length} cases completed</span>`)}
        ${station("defs","Definition Drill","Solo","Match each cardinal virtue to its definition, then write all four (and virtue itself) from memory.", P.recallBest != null ? `<span>Best recall <b>${P.recallBest}</b> / ${RECALL.length}</span>` : `<span>Match, then recall</span>`)}
        ${station("traits","Characteristics Sort","Solo or pairs","Sort the elements, vices, and roles of each virtue from class into the right virtue. This is the raw material for Steps 2 and 3.", P.traitsBest != null ? `<span>Best <b>${P.traitsBest}</b> / 16</span>` : `<span>${TRAITS.length} elements</span>`)}
        ${station("spot","Spot the Virtue","Solo or pairs","Short real-life moments: name the virtue most at stake, then see which element shows it.", P.spotBest != null ? `<span>Best <b>${P.spotBest}</b> / 12</span>` : `<span>${SPOTS.length} moments</span>`)}
        ${station("toolkit","Virtue Toolkit","Reference","Definitions, essential characteristics, the mean, and key quotes for prudence, justice, temperance, and fortitude.", `<span>4 cardinal virtues</span>`)}
      </div>`;
  }
};

/* ---- Toolkit ---- */
V.toolkit = {
  render(){
    view.innerHTML = `<div class="view-head"><span class="eyebrow">Unit 2 · Reference</span><h1>Virtue Toolkit</h1>
        <p>Everything you need for Step 2 of a case study: the class definition of each cardinal virtue, its essential characteristics, its vices, and how it works with the others.</p></div>
      <dl class="basics">${VIRTUE_BASICS.map(([t, d]) => `<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl>
      <div class="vgrid">${VIRTUES.map(virtueCard).join("")}</div>`;
  }
};

/* ---- Virtue Case Lab ---- */
const blankDraft = () => ({1:"",2:"",3:"",4:""});
V.vlab = {
  init(){ S = { ci:0, mode:"steps", step:1, hints:{}, checks:{}, revealed:{}, mins:30, left:0, timer:null, started:false }; },
  stop(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } },
  c(){ return VCASES[S.ci]; },
  key(){ return S.mode === "bluebook" ? "bb" : "st"; },
  draft(){ P.u2 = P.u2 || {}; const c = this.c(); P.u2[c.id] = P.u2[c.id] || {}; return P.u2[c.id][this.key()] = P.u2[c.id][this.key()] || blankDraft(); },
  render(){
    const c = this.c();
    const head = `<div class="view-head"><span class="eyebrow">Unit 2 · Case Study Practice</span><h1>Virtue Case Lab</h1>
      <p>Use the four-step method from class. Your writing saves in this browser as you go.</p></div>`;
    const picker = `<div class="case-pick" role="group" aria-label="Choose a case">${VCASES.map((x, i) => `<button type="button" data-act="case" data-i="${i}" aria-pressed="${i === S.ci}">${esc(x.t)}${P.u2done && P.u2done[x.id] ? ' <span class="d" aria-label="completed">✓</span>' : ""}</button>`).join("")}</div>`;
    const modes = `<div class="tabs" role="group" aria-label="Practice mode">${[["steps","Step by step"],["pairs","Pairs"],["bluebook","Blue book (timed)"]].map(([k, l]) => `<button type="button" data-act="mode" data-v="${k}" aria-pressed="${S.mode === k}">${l}</button>`).join("")}</div>`;
    let body;
    if (S.mode === "pairs") body = this.pairs(c);
    else if (S.mode === "bluebook") body = this.bluebook(c);
    else body = S.step === 5 ? this.compare(c) : this.steps(c);
    view.innerHTML = head + `<div class="stack">${picker}<div class="row between">${modes}</div>${body}</div>`;
  },
  stepper(){
    return `<ol class="stepper">${STEPS.map(s => `<li><button type="button" data-act="go" data-n="${s.n}" aria-current="${S.step === s.n ? "step" : "false"}"><span class="num">${s.n}</span><span class="lbl">${esc(s.t)}</span></button></li>`).join("")}
      <li><button type="button" data-act="go" data-n="5" aria-current="${S.step === 5 ? "step" : "false"}"><span class="num">✓</span><span class="lbl">Compare</span></button></li></ol>`;
  },
  prompts(s){ return `<ul class="prompts">${s.q.map(q => `<li>${esc(q)}</li>`).join("")}</ul>`; },
  steps(c){
    const s = STEPS[S.step - 1], d = this.draft();
    const hint = S.step === 1 ? c.h1 : S.step === 3 ? c.h3 : null;
    const hk = c.id + S.step;
    return caseCard(c) + this.stepper() + `<section class="panel stack" aria-labelledby="step-title">
        <div class="row between"><span class="eyebrow">Step ${s.n} of 4</span>${hint ? `<button class="btn sm" type="button" data-act="hint" data-k="${hk}">${S.hints[hk] ? "Hide hint" : "Need a hint?"}</button>` : ""}</div>
        <h2 id="step-title" class="step-h">${esc(s.t)}</h2>
        ${this.prompts(s)}
        <p class="muted">${esc(s.tip)}</p>
        ${hint && S.hints[hk] ? `<div class="feedback hint"><b>Hint</b>${esc(hint)}</div>` : ""}
        ${S.step === 2 || S.step === 3 ? quickRef() : ""}
        <label class="fl" for="u2-ans-${s.n}">Your answer<textarea id="u2-ans-${s.n}" data-step="${s.n}" rows="${s.n === 1 ? 6 : 8}">${esc(d[s.n])}</textarea></label>
        <div class="row between"><button class="btn" type="button" data-act="go" data-n="${S.step - 1}" ${S.step === 1 ? "disabled" : ""}>← Back</button>
          <button class="btn primary" type="button" data-act="go" data-n="${S.step + 1}">${S.step === 4 ? "Compare with the model →" : "Next step →"}</button></div>
      </section>`;
  },
  compare(c){
    const d = this.draft(), ck = S.checks[c.id] || {};
    const got = Object.values(ck).filter(Boolean).length;
    return caseCard(c, false) + (S.mode === "steps" ? this.stepper() : "") + `
      <p class="muted">Read the ${c.teacher ? "teacher’s sample" : "model answer"} next to yours, step by step. It shows one strong answer at about blue book length; yours can reach a different conclusion if you defend it well.</p>
      ${STEPS.map(s => `<section class="compare-step"><h2 class="step-h"><span class="num">${s.n}</span>${esc(s.t)}</h2>
        <div class="compare">
          <div class="yours"><span class="eyebrow">Your answer</span>${d[s.n].trim() ? `<div class="pre">${esc(d[s.n])}</div>` : `<p class="muted">You didn’t write anything for this step.</p>`}</div>
          <div class="model"><span class="eyebrow">${modelLabel(c)}</span>${modelStep(c, s.n)}</div>
        </div></section>`).join("")}
      <section class="panel stack"><div class="row between"><span class="eyebrow">Check your work</span><b class="num" id="ckcount">${got} / ${RUBRIC.length}</b></div>

V.defs = {

      return;
    }
    const it = S.items[S.i], done = S.picked !== null;
    const opts = it.type === "n2d" ? VK.map(k => ({ k, l:this.def(k) })) : VK.map(k => ({ k, l:vname(k) }));
    const prompt = it.type === "n2d" ? `What is the definition of <b class="v-${it.k} vtxt">${esc(vname(it.k))}</b>?` : `Which virtue is defined as “${esc(this.def(it.k))}”?`;

        ${done ? `<div class="feedback${S.picked === it.k ? "" : " no"}" role="status"><b>${S.picked === it.k ? "Correct." : "Not quite."}</b>${esc(vname(it.k))}: ${esc(this.def(it.k))}</div>

      </div></div>`;

  grade(r, txt){
    const t = " " + txt.toLowerCase().replace(/[^a-z\s-]/g, " ").replace(/\s+/g, " ") + " ";
    const missing = r.need.filter(alts => !alts.some(a => t.includes(" " + a + " ") || t.includes(" " + a + "s ") || (a.includes(" ") && t.includes(a))));

    if (act === "clear") { S.recall = {}; S.checked = false; }
    this.render();
  },
  input(e){ const k = e.target.dataset.rk; if (k) { S.recall[k] = e.target.value; } },
  key(e){ if (S.stage !== "match" || S.picked !== null) return; const n = "1234".indexOf(e.key); if (n < 0) return;

};

V.mquiz = {
  init(){
    const defs = shuffle(MTERMS).slice(0, 9).map(t => {
      const same = MTERMS.filter(x => x !== t && x.c === t.c), other = MTERMS.filter(x => x !== t && x.c !== t.c);
      const wrong = shuffle(same).slice(0, 3); while (wrong.length < 3) wrong.push(shuffle(other)[0]);
      const o = shuffle([t, ...wrong]);
      return { q:"Which term matches this definition?", d:t.d, o:o.map(x => x.t), a:o.indexOf(t), e:t.t + ": " + t.d, cat:t.c };
    });
    const con = shuffle(MCQ).slice(0, 6).map(x => { const ord = shuffle([0,1,2,3]); return { q:x.q, o:ord.map(k => x.o[k]), a:ord.indexOf(x.a), e:x.e }; });
    S = { qs: shuffle([...defs, ...con]), i:0, picked:null, score:0, missed:[], done:false };
  },
  render(){
    const head = `<div class="view-head"><span class="eyebrow">Unit 1 · Moral language</span><h1>Moral Language Quiz</h1>
      <p>Nine definition matches and six questions that apply the ideas. Read the explanation after each answer.</p></div>`;

        <div class="scorebig num">${S.score}/${S.qs.length}</div><button class="btn primary" type="button" data-act="again">New round</button></div>
        ${S.missed.length ? `<h2 class="section-title">Review what you missed</h2><ul class="missed">${S.missed.map(q => `<li class="stack" style="gap:4px"><b>${esc(q.d ? q.o[q.a] : q.q)}</b><span class="muted">${esc(q.e)}</span></li>`).join("")}</ul>` : ""}</div>`;
      return;
    }
    const q = S.qs[S.i], done = S.picked !== null;
    view.innerHTML = head + `<div class="stack">
      <div class="stats"><span>Question <b>${S.i + 1}</b> of <b>${S.qs.length}</b></span><span>Score <b>${S.score}</b></span></div>
      <div class="progress" aria-hidden="true"><span style="width:${(S.i + (done ? 1 : 0)) / S.qs.length * 100}%"></span></div>
      <div class="panel stack">${q.cat ? catChip(q.cat) : ""}<p class="q-text">${esc(q.q)}</p>${q.d ? `<blockquote class="defq">${esc(q.d)}</blockquote>` : ""}
        <div class="opts">${q.o.map((o, k) => { let cls = "opt"; if (done) cls += k === q.a ? " right" : k === S.picked ? " wrong" : " dim";
          return `<button type="button" class="${cls}" data-act="pick" data-k="${k}" ${done ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>
        ${done ? `<div class="feedback${S.picked === q.a ? "" : " no"}" role="status"><b>${S.picked === q.a ? "Correct." : "Not quite. The answer is " + "ABCD"[q.a] + "."}</b>${esc(q.e)}</div>
        <div class="row end"><button class="btn primary" type="button" data-act="next">${S.i + 1 < S.qs.length ? "Next question →" : "See my score"}</button></div>` : ""}
      </div></div>`;
    if (done) view.querySelector('[data-act="next"]').focus();
  },
  click(act, el){
    if (act === "again") this.init();

    if (act === "next") { if (S.i + 1 < S.qs.length) { S.i++; S.picked = null; } else { S.done = true; P.mquizBest = Math.max(P.mquizBest ?? 0, S.score); saveP(); } }

function route(){
  const name = location.hash.slice(1);
  const next = V[name] && !["home","landing"].includes(name) ? name : "landing";
  if (V.current && V[V.current] && V[V.current].stop && next !== V.current) V[V.current].stop();
  V.current = next;
  document.body.dataset.view = next;
  if (!["landing","unit1","unit2","unit3"].includes(next)) { P.unit = U2_VIEWS.includes(next) ? "u2" : U1_VIEWS.includes(next) ? "u1" : "u3"; saveP(); }
  const un = (P.unit || "u3").slice(1);
  $("#homeLink").hidden = ["landing","unit1","unit2","unit3"].includes(next);
  $("#homeLink").href = "#unit" + un;
  $("#homeLink").textContent = "All Unit " + un + " stations";
  if (V[next].init) V[next].init();
  V[next].render();
  window.scrollTo(0, 0);
}
