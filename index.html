/* ---- Mean Builder ---- */
const SLOTS = [["d","Deficiency"],["v","Virtue (the mean)"],["x","Excess"]];
V.mean = {
  init(){ S = { order: shuffle(MEAN.map((_, i) => i)), i:0, score:0, done:false }; this.setup(); },
  setup(){
    const m = MEAN[S.order[S.i]];
    const others = MEAN.filter(o => o !== m);
    const decoy = others[Math.floor(Math.random() * others.length)];
    const dv = [decoy.d, decoy.v, decoy.x][Math.floor(Math.random() * 3)];
    S.pool = shuffle([m.d, m.v, m.x, dv]); S.placed = {}; S.step = 0; S.checked = false;
  },
  render(){
    const head = `<div class="view-head"><span class="eyebrow">Key Ideas · Doctrine of the Mean</span><h1>Mean Builder</h1>
      <p>Each virtue sits between a vice of too little and a vice of too much. Tap the words in order: deficiency, then the virtue, then the excess. One word doesn’t belong.</p></div>`;
    if (S.done) {
      view.innerHTML = head + `<div class="panel stack" style="text-align:center;justify-items:center"><span class="eyebrow">All virtues done</span>
        <div class="scorebig num">${S.score}/${MEAN.length}</div><p class="muted">Perfect rows on the first try.</p>
        <button class="btn primary" type="button" data-act="again">Go again</button></div>`;
      return;
    }
    const m = MEAN[S.order[S.i]];
    const used = Object.values(S.placed);
    view.innerHTML = head + `<div class="stack">
      <div class="stats"><span>Virtue <b>${S.i + 1}</b> of <b>${MEAN.length}</b></span><span>Perfect rows <b>${S.score}</b></span></div>
      <div class="prompt-card"><span class="eyebrow">Sphere of life</span><div class="big">${esc(m.s)}</div></div>
      <div class="slots">${SLOTS.map(([k, lab], n) => {
        const val = S.placed[k]; let cls = "slot";
        if (!S.checked && n === S.step) cls += " active";
        if (val) cls += " filled";
        if (S.checked) cls += val === m[k] ? " ok" : " no";
        return `<div class="${cls}"><span class="lab">${lab}</span><span class="val">${val ? esc(val) : "&nbsp;"}</span>${S.checked && val !== m[k] ? `<span class="fix">Answer: ${esc(m[k])}</span>` : ""}</div>`;
      }).join("")}</div>
      ${S.checked ? `<div class="feedback${SLOTS.every(([k]) => S.placed[k] === m[k]) ? "" : " no"}" role="status"><b>${SLOTS.every(([k]) => S.placed[k] === m[k]) ? "Perfect row." : "Check the corrections above."}</b>${esc(m.d)} ← <b style="display:inline">${esc(m.v)}</b> → ${esc(m.x)}</div>
        <div class="row end"><button class="btn primary" type="button" data-act="next">${S.i + 1 < MEAN.length ? "Next virtue →" : "Finish"}</button></div>`
      : `<div class="pool">${S.pool.map(w => `<button type="button" data-act="place" data-w="${esc(w)}" ${used.includes(w) ? "disabled" : ""}>${esc(w)}</button>`).join("")}</div>
        <div class="row" style="justify-content:center"><button class="btn sm" type="button" data-act="undo" ${S.step ? "" : "disabled"}>Undo</button></div>`}
    </div>`;
    if (S.checked) view.querySelector('[data-act="next"]').focus();
  },
  click(act, el){
    const m = MEAN[S.order[S.i]];
    if (act === "again") this.init();
    if (act === "place" && S.step < 3) { S.placed[SLOTS[S.step][0]] = el.dataset.w; S.step++;
      if (S.step === 3) { S.checked = true; if (SLOTS.every(([k]) => S.placed[k] === m[k])) S.score++; } }
    if (act === "undo" && S.step) { S.step--; delete S.placed[SLOTS[S.step][0]]; }
    if (act === "next") { if (S.i + 1 < MEAN.length) { S.i++; this.setup(); } else { S.done = true; P.meanBest = Math.max(P.meanBest ?? 0, S.score); saveP(); } }
    this.render();
  }
};

    if (act === "check") { const b = view.querySelector(".checks b"); if (b) b.textContent = S.checks.filter(Boolean).length + " / 3 points"; return; }

/* ---- Case Lab ---- */
const STANCES = ["ve","deon","util"];
V.cases = {
  init(){ S = { mode:"solo", order: shuffle(CASES.map((_, i) => i)), i:0, stance:null, spinning:false, shown:false, issue:"", resp:"", names:"", group:null }; },
  render(){
    const c = CASES[S.order[S.i]];
    const head = `<div class="view-head"><span class="eyebrow">Case Study Analysis · 10 pts</span><h1>Case Lab</h1>
      <p>On the test you’ll name the key moral issue, then respond from an assigned stance. Here the stance is random, so you practice arguing views you may not hold.</p></div>`;
    const modeTabs = `<div class="tabs" role="group" aria-label="Mode"><button type="button" data-act="mode" data-v="solo" aria-pressed="${S.mode === "solo"}">Solo</button><button type="button" data-act="mode" data-v="group" aria-pressed="${S.mode === "group"}">Group</button></div>`;
    const caseBlock = `<div class="panel stack">
        <div class="row between"><span class="eyebrow">Case ${S.i + 1} of ${CASES.length}</span><button class="btn sm" type="button" data-act="nextcase">New case →</button></div>
        <h2 style="font-size:clamp(26px,4vw,36px)">${esc(c.t)}</h2>
        <p class="case-text">${esc(c.s)}</p></div>`;
    const lenses = mine => `<div class="stack" style="gap:10px">
        <div class="lens t-gen"><h3>Key moral issue</h3><p>${esc(c.i)}</p></div>
        ${STANCES.map(k => `<div class="lens t-${k}${mine === k ? " mine" : ""}"><h3>${TH[k].name}${mine === k ? " · your stance" : ""}</h3><p>${esc(c[k])}</p></div>`).join("")}</div>`;

    if (S.mode === "group") {
      view.innerHTML = head + `<div class="stack">${modeTabs}${caseBlock}
        <div class="panel stack">
          <label class="fl" for="group-names">Group members (separate with commas)<input type="text" id="group-names" value="${esc(S.names)}" placeholder="Maya, Jordan, Luis, Grace"></label>
          <div class="row end"><button class="btn primary" type="button" data-act="assign">Assign stances</button></div>
          ${S.group ? `<div class="group-list">${S.group.map(g => `<div class="group-row t-${g.k}"><b>${esc(g.n)}</b><span class="chip t-${g.k}">${TH[g.k].name}</span></div>`).join("")}</div>
            <p class="muted">Give everyone 3 minutes to write the moral issue and their response. Then each person argues their stance, and the next person must respond to the one before.</p>` : ""}
        </div>
        ${S.group ? `<div class="panel stack"><div class="row between"><span class="eyebrow">Model answers</span><span class="row">${gated() && !S.shown ? `<label class="toggle sm"><input type="checkbox" id="gw" data-act="gw" ${S.gw ? "checked" : ""}> Everyone has written and argued their stance</label>` : ""}<button class="btn sm" type="button" data-act="reveal" ${gated() && !S.shown && !S.gw ? "disabled" : ""}>${S.shown ? "Hide" : "Show"}</button></span></div>${S.shown ? lenses(null) : ""}</div>` : ""}
      </div>`;
      return;
    }

    view.innerHTML = head + `<div class="stack">${modeTabs}${caseBlock}
      <div class="panel stack">
        <div class="stance-wrap">${S.stance ? `<span class="stance t-${S.stance}" id="stance">${TH[S.stance].name}</span>` : `<span class="muted">No stance yet.</span>`}
          <button class="btn${S.stance ? "" : " primary"}" type="button" data-act="spin" ${S.spinning ? "disabled" : ""}>${S.stance ? "Re-roll stance" : "Roll my stance"}</button></div>
        ${S.stance ? `<label class="fl" for="case-issue">1. What is the key moral issue?<textarea id="case-issue" style="min-height:80px">${esc(S.issue)}</textarea></label>
        <label class="fl" for="case-resp">2. Respond as a ${TH[S.stance].name === "Utilitarianism" ? "utilitarian" : TH[S.stance].name === "Deontology" ? "deontologist" : "virtue ethicist"}. What should be done, and why?<textarea id="case-resp">${esc(S.resp)}</textarea></label>
        <div class="row between"><span class="row">${gated() && !S.shown ? `<span id="cwc">${this.counters()}</span>` : ""}</span><button class="btn primary" type="button" data-act="reveal" ${S.shown || this.canCompare() ? "" : "disabled"}>${S.shown ? "Hide model answers" : "Compare with model answers"}</button></div>` : ""}
      </div>
      ${S.shown && S.stance ? `<div class="panel stack"><span class="eyebrow">Model answers</span>${lenses(S.stance)}
        <div class="checks"><span class="eyebrow">Did your answer…</span>
          ${["name the moral issue in one clear sentence?","use your stance’s key terms (virtue, duty, maxim, utility…)?","reach a clear conclusion about what to do?"].map((l, n) => `<label><input type="checkbox" id="case-chk-${n}">${l}</label>`).join("")}</div>

  counters(){ return `Issue ${wcGate(wc(S.issue), GATES.u3Case.issue)} · Response ${wcGate(wc(S.resp), GATES.u3Case.resp)}`; },
  canCompare(){ return !gated() || (wc(S.issue) >= GATES.u3Case.issue && wc(S.resp) >= GATES.u3Case.resp); },
  input(e){ if (e.target.id === "case-issue" || e.target.id === "case-resp") { this.keep(); const c = $("#cwc"); if (c) c.innerHTML = this.counters(); const b = view.querySelector('[data-act="reveal"]'); if (b && !S.shown) b.disabled = !this.canCompare(); } },
  click(act, el){
    this.keep();
    if (act === "mode") { S.mode = el.dataset.v; S.shown = false; }
    if (act === "nextcase") { if (S.shown || S.group) { P.cases++; saveP(); } S.i = (S.i + 1) % CASES.length; Object.assign(S, { stance:null, shown:false, issue:"", resp:"", group:null, gw:false }); window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }); }
    if (act === "gw") S.gw = el.checked;
    if (act === "reveal") { if (!S.shown && ((S.mode === "solo" && !this.canCompare()) || (S.mode === "group" && gated() && !S.gw))) return; S.shown = !S.shown; }
    if (act === "assign") {
      const names = S.names.split(",").map(s => s.trim()).filter(Boolean);
      if (!names.length) { $("#group-names").focus(); return; }
      let pool = []; while (pool.length < names.length) pool = pool.concat(shuffle(STANCES));
      S.group = shuffle(names).map((n, k) => ({ n, k: pool[k] }));
    }
    if (act === "spin") { this.spin(); return; }
    this.render();
  },
  spin(){
    const final = STANCES[Math.floor(Math.random() * 3)];
    if (reduceMotion) { S.stance = final; S.shown = false; this.render(); return; }
    S.spinning = true; S.stance = S.stance || "ve"; S.shown = false; this.render();
    let n = 0; const total = 12;
    const tick = () => {
      const el = $("#stance"); if (!el || V.current !== "cases") return;
      const k = n < total ? STANCES[n % 3] : final;
      el.className = "stance t-" + k; el.textContent = TH[k].name;
      if (n++ < total) setTimeout(tick, 50 + n * 12); else { S.stance = final; S.spinning = false; this.render(); setTimeout(() => $("#case-issue")?.focus(), 0); }
    };
    tick();
  }
};

        <span class="eyebrow">Don’t say</span><div class="taboo">${term.x.map(w => `<span>${esc(w)}</span>`).join("")}</div></div>
      <div class="row" style="justify-content:center"><button class="btn" type="button" data-act="skip">Skip</button><button class="btn primary" type="button" data-act="got">Got it! +1</button></div>
      <div class="row" style="justify-content:center"><button class="btn sm" type="button" data-act="end">End round early</button></div></div>`;
  },
  endRound(){ this.stop(); S.turn = (S.turn + 1) % S.teams.length; S.stage = "between"; P.describeRounds++; saveP(); this.render(); },
  click(act, el){
    if (act === "addteam") S.teams.push({ n:"Team " + (S.teams.length + 1), s:0 });
    if (act === "rmteam") S.teams.pop();
    if (act === "secs") S.secs = +el.dataset.v;
    if (act === "go") {
      S.stage = "play"; S.left = S.secs; S.roundPts = 0; S.di++;
      this.stop(); S.timer = setInterval(() => {
        if (V.current !== "describe") return this.stop();
        S.left--; const t = $("#dtimer"); if (t) { t.textContent = S.left; t.classList.toggle("low", S.left <= 10); }
        if (S.left <= 0) this.endRound();
      }, 1000);
    }
    if (act === "got") { S.teams[S.turn].s++; S.roundPts++; S.di++; }
    if (act === "skip") S.di++;
    if (act === "end") return this.endRound();
    this.render();
  },
  input(e){ const i = e.target.dataset.i; if (i != null) S.teams[i].n = e.target.value; }
};

  ["Habit", "Formed over time with intention, and always changeable. Habits shape both who we are and the world around us."]
];

const VCASES = [
  { id:"captain", t:"The Captain’s Choice", tag:"Athletics", teacher:true,
    s:["Maya is a senior and captain of the girls’ varsity soccer team at a boarding school. On Saturday the team plays the state semifinal, the furthest the program has gone in twelve years.",
       "On Thursday night, an hour after dorm check-in, Maya looks out her window and sees two teammates crossing the quad back toward the dorm. One is Jess, her best friend since freshman year and the team’s starting goalkeeper. The other is Riley, a junior midfielder. Friday morning Maya finds a vape between the couch cushions in the dorm common room. When she asks Jess about it, Jess admits they slipped off campus to a party in town. She says she vaped “just to take the edge off before Saturday” and that it was the only time.",
       "School policy is clear. Leaving campus after check-in means automatic suspension from the next athletic contest, and substance use goes to the disciplinary committee. The backup goalkeeper is a sophomore who has never played a varsity minute.",
       "At Friday practice, the coach pulls the captains aside: “If anything happened this week that I need to know about, I need to hear it before tomorrow.” That afternoon Jess texts Maya: “A college coach is coming Saturday to watch me. This is my shot. It was one night. Please.” Riley says nothing to Maya, but a freshman on the team quietly tells Maya that she saw the two of them leave and asks what she should do.",
       "Maya also wants to win Saturday’s game more than anything she has wanted in high school."],
    h1:"Who else is affected besides Maya, Jess, and Riley? Think about the freshman who saw them, the coach who asked, and the sophomore keeper.",
    h3:"Look closely at Jess’s words “just to take the edge off” and her text to Maya. What do they show about temperance and justice?",
    m:{ p:"Is it ethical for Maya to withhold the information about Jess and Riley from her coach and the school?",
        sec:["Vaping","Sneaking off campus","Competing in the state semifinal"],
        st:["Maya","Jess","Riley","The freshman"],
        v:"Prudence, right deliberation in action, is needed in this case study. It provides a sense of the conscience as well as appropriate discernment that is needed here. Likewise, there is a need for justice, giving what is due. Justice offers the elements of right relationships and duties based upon different forms of relationships (i.e. personal, communal, institutional). Temperance, self-moderation of desires, pleasures, and emotions, is also important. Temperance reminds us to maintain a healthy balance of pursuing physical pleasures by placing rationality over appetites. Finally, fortitude, facing challenges well, is also needed. Fortitude helps us to endure or attack different challenges while making sure fear does not rule our lives.",
        a:["Maya needs all four virtues. Prudence helps her see truthfully: she saw Jess and Riley herself and Jess admitted it, so this is not a rumor, and the coach has asked the captains directly. Justice asks what she owes each person: honesty to her coach, fairness to the sophomore keeper and the rest of the team, and real friendship to Jess, which wants Jess to be good and not just happy. Temperance keeps her desire to win, and her wish to avoid a fight with her best friend, from overruling moral truth. Fortitude lets her take the right course of action before Saturday, even though it is hard.",
           "Jess and Riley needed temperance to avoid creating the situation in the first place. Jess used a pleasure to manage an emotion (“just to take the edge off”), the opposite of placing reason over desire. If they had used prudence to see that a semifinal and a college coach’s visit were not worth a night’s satisfaction, we would not have this case. They owe justice to their teammates by living up to the code of conduct, and Jess now fails in justice again by using their friendship (“Please”) to pressure Maya. Riley’s silence shows a lack of fortitude; the just and courageous move is for both of them to go to the coach themselves.",
           "The freshman has shown fortitude by approaching Maya with the truth and prudence by seeking counsel from someone more experienced. She probably needs a little more fortitude to tell the coach, even though she risks her social standing and reputation. As captain, Maya owes her a good example."],
        r:"Although not easy, Maya needs to tell her coach the truth as a matter of justice. It will take great courage, knowing that victory might be sacrificed by losing two key players; however, prudence dictates that we must take the right action. As the rules of the school are not unjust, the right relationship to the institution requires this honesty of Maya. Although some would argue that nobody experienced hurt from this situation, by enabling her friends Maya will be supporting the building up of vicious habits that might lead to more detrimental actions and consequences further down the road." } },

  { id:"cs1", t:"Practice Case #1: Voluntourism", tag:"Class practice case", cls:true,
    s:["“Barbie Savior” is a popular Instagram account that features satirical, photoshopped images of a Barbie doll traveling the world and taking selfies with the disadvantaged—those in poverty, those affected by disaster, orphans, etc. With over 160,000 followers on Instagram, “Barbie Savior” is a satirical representation of growing concern over the multibillion dollar so-called “voluntourism” industry. The captions from Barbie Savior are often comically self-directed and seek to highlight how volunteer work abroad, if not engaged in carefully, can be superficial, empty, and even harmful.",
       "Every year, over 1.6 million people volunteer abroad, usually with good intentions of helping out in underserved communities. However, critics of voluntourism point out that the damage done to communities can quickly outweigh the benefits. Volunteers who are untrained or unspecialized in building, for instance, may produce unsafe, shoddy work that will have to be taken down and rebuilt by locals. Additionally, if there is no shortage of locals who are able and willing to work, bringing in foreign volunteers can displace local jobs. To make things worse, not all volunteer aid organizations do have the best intentions, and may exploit rather than help local communities. One orphanage in Cambodia, for example, forced children to toil in rice paddies and beat and starved them, all while pocketing charitable donations. While many aid organizations are not comparably fraudulent or corrupt, critics contend that voluntourism can support an unsustainable and repressive dependence on Western nations which enforces racialized hierarchies and stereotypes without providing longer-term solutions that empower the communities being served.",
       "Despite some possible pitfalls, volunteering abroad does have the potential to provide needed, powerful, and lasting benefits to both the community and the volunteer. Proponents insist that, if operated as a mutual exchange of knowledge, skills, and resources, development projects can make lasting and meaningful change in communities where it is needed. For example, non-profits that place locals in charge of projects and partner with existing community organizations emphasize a “bottom-up” approach that focuses on empowerment and building self-sustaining, resilient programs, rather than merely providing short-term resource handouts. Respecting local culture and customs and recognizing that local people understand their own needs, barriers, and capabilities best are key to performing work ethically, aid organizations argue. In this way, travelers can avoid having the “savior” mentality satirized above—where they assume that they know more or have more skills just by virtue of coming from a more developed country. Instead, volunteers can use this opportunity to listen and learn, to form deep connections with the local people, and to grow their senses of empathy and compassion that will hopefully lead to more selfless acts in the future.",
       "Others worry, however, that discouraging or regulating voluntourism may end up doing more harm than good because volunteers, at the very least, bring money and attention to notable causes. For instance, FORGE, a charity for refugees, shifted away from volunteers towards a model designed to help people more effectively. However, their income fell drastically because volunteers were their primary fundraisers. Despite critiques that voluntourism focuses too much on the volunteers’ experience rather than the impact and effectiveness of their programs, it may be the reality that volunteers, even “bad” ones, are vital for some organizations to do their work in the first place."],
    h1:"There is no single main character here. Who is affected when a volunteer goes abroad: the volunteer, the community, local workers, the organization, and charities like FORGE?",
    h3:"Whose good is the trip really for? Look at the selfies Barbie Savior mocks and the volunteers who “listen and learn.” What separates them?",
    m:{ p:"Should someone who wants to help people in need volunteer abroad through a voluntourism program?",
        sec:["Untrained volunteers doing unsafe or shoddy work","Volunteers taking jobs from local workers","Fraudulent organizations that exploit communities (the Cambodian orphanage)","The “savior” mentality and dependence on wealthier nations","Charities like FORGE that rely on volunteers for funding"],
        st:["The volunteers","The local communities being served","Local workers","Aid organizations, honest and fraudulent","Charities that depend on volunteer fundraising"],
        v:"Justice, giving what is due, is the central virtue in this case. Its key elements of right relationship, the common good, and proportional equality (equity) ask what each community is actually owed, including the dignity of leading its own projects. Prudence, right deliberation in action, is needed to see the situation truthfully and to choose the best means to a good desire; it reminds us that context is essential and that good intentions are not enough. Temperance, self-control and moderation of desires, pleasures, and emotions, applies because the trip can become about the volunteer’s experience, photos, and good feelings. Fortitude, facing challenges and difficulties well, is needed for the harder, longer work of real service and for the humility of learning rather than leading.",
        a:["The volunteer needs prudence first. The desire to help is good, but prudence sees truthfully that untrained building can be unsafe and that some organizations, like the Cambodian orphanage, exploit the very children they claim to serve. Prudence chooses the best means: researching organizations, choosing ones that put locals in charge, and offering skills that are actually needed. Justice asks what the community is due: work that helps rather than harms, jobs that stay with local workers, and respect for people who understand their own needs best. Temperance checks the desire for selfies and the pleasure of feeling like a “savior,” the vice Barbie Savior mocks. Fortitude means committing to the slower work of listening, learning, and lasting partnership.",
           "The local communities are owed justice: dignity, right relationship, and a real say in their own futures. They are not props in someone else’s story. Local workers are owed the jobs that volunteers can displace, so a just program never replaces paid local labor with free foreign labor.",
           "Aid organizations need justice and prudence most. Fraudulent groups commit grave injustice by profiting from suffering. Honest groups like FORGE face a real prudential problem: the model that helps people most effectively cost them their funding. They need fortitude to keep doing what works while finding honest ways to raise support."],
        r:"Someone who wants to help may volunteer abroad, but only if prudence and justice shape the trip. The most virtuous response is to choose an organization that places locals in charge, to offer only skills that are actually needed, and to go as a learner and partner rather than a savior; if no such program fits, the person should give money or serve closer to home instead. The good of the community, not the volunteer’s experience, is the true end of the act. Some would argue, as the FORGE example suggests, that even “bad” volunteers bring money and attention that charities need. But justice does not let us treat a community’s needs as a backdrop for our own good feelings, and prudence shows that the answer is not to stop volunteering but to volunteer well, turning volunteers into informed supporters and fundraisers for programs that truly help." } },

  { id:"cs2", t:"Practice Case #2: Snow White and Representation", tag:"Class practice case", cls:true,
    s:["In recent years, Disney live-action remakes have been the topic of news headlines and 1-star Letterboxd reviews alike. In 2023, however, one particular live-action remake would spark a heated debate over more than others. The live-action remake of Snow White and The Seven Dwarves would be incomplete without the titular dwarves. The company initially considered hiring actors with dwarfism, aligning with the original and subsequent animated portrayals of the characters in the animated film. The portrayal of disabilities has been the center of debate for multiple franchises, including critiques for the 2020 adaptation of Roald Dahl’s novel The Witches. This film depicted a villain with limb differences, drawing critique for encouraging children to see those with missing fingers as witches.",
       "Actors with disabilities have progressed in how they are represented in the film industry. Troy Kotsur, born deaf, recently won an Oscar for his performance in CODA, making him the first male deaf actor, and second deaf actor in general (after Marlee Matlin) to win an acting Oscar. The Marvel Cinematic Universe recently introduced its first deaf superhero, played by deaf American actor Lauren Ridloff. While these films were praised for representing not only deaf characters but also for providing opportunities for deaf actors, the community of actors with dwarfism was divided on Snow White and The Seven Dwarves. Peter Dinklage, best known for his role on Game of Thrones, is a person with dwarfism. He publicly criticized Disney for perpetuating stereotypes by using actors with dwarfism for the Snow White remake. In response, Disney opted to use CGI to represent the dwarves, staying true to their representation in the original animated film. This choice, however, was still met with critique. While Peter Dinklage enjoys popular fame and is a recognized thespian based on his many award nominations and wins, other lesser-known actors with dwarfism argued that roles remain few and far between. These actors argue that by using CGI for the seven dwarves, actors were deprived of a rare employment opportunity.",
       "This controversy has sparked legal debate, with some arguing that the decision to omit actors with dwarfism might violate the Americans with Disabilities Act (ADA), which mandates equal employment opportunities for people with disabilities. While 30% of the U.S. population identify as having a disability, they remain underrepresented in the acting industry. Studies have found that only 21% of characters with disabilities on network television are portrayed by individuals who themselves have a disability. This points to a broader systemic issue: disabled actors face barriers to inclusion even in roles they identify with. This leads not only to fewer employment opportunities for individuals with disabilities, but also inauthentic portrayals of their lived experiences. Some critics also argue that casting non-disabled actors to portray disability turns disability into a costume, reinforcing harmful stereotypes and reducing lived experience to spectacle. Acting traditionally involves stepping into experiences beyond one’s own experiences, leading some to ask whether actors should be limited to roles that match their exact identity.",
       "Debates around representation in media continue beyond the screen. In France, an adaptation of Beauty and the Beast for a children’s book recently lost government funding. This particular adaptation featured Black protagonists, rejecting the original representation of the story and the cultural makeup of France. The fairy tale was initially published in 1740, but now France has the largest black population in Europe, with more than half of Black Europeans living in France. In 2023, a live adaptation of The Little Mermaid was launched with a similar twist: Ariel was played by a Black woman. This led to similar backlash from U.S. audiences and abroad. Likewise, the casting of a Latina actress as Snow White drew controversy from those who felt the casting veered too far from the “traditional” image of the character—despite the story’s fictional roots and evolving cultural meaning.",
       "These are beloved stories which have maintained through generations, leading some to argue that their authenticity should be maintained by preserving the physical and cultural traits the authors originally intended. Others argue that contemporary values should be applied to these stories, allowing them to grow as societies do. Perhaps we are existing within Plato’s cave— trapped in our own limited experiences with ideas of what diversity and representation “should” look like, just as the authors of these stories were trapped within their own experiences when writing."],
    h1:"Actors with dwarfism don’t all agree here. Separate Peter Dinklage from the lesser-known actors, then add Disney, audiences, and children with disabilities who watch the film.",
    h3:"Is the stereotype in who plays the dwarfs, or in how the dwarfs are written? Prudence looks for a means that gives each group what it is due.",
    m:{ p:"Was Disney right to use CGI for the seven dwarfs instead of hiring actors with dwarfism?",
        sec:["Whether casting actors with dwarfism as the dwarfs perpetuates stereotypes","Equal employment for actors with disabilities (the ADA)","Portrayals of disability as villainy or spectacle (The Witches)","Whether classic stories should keep their original portrayals or be recast (The Little Mermaid, Snow White, Beauty and the Beast)"],
        st:["Disney and the filmmakers","Peter Dinklage","Lesser-known actors with dwarfism","Audiences, especially children with disabilities","The wider disability community"],
        v:"Justice, giving what is due, is at the heart of this case. Its key elements of right relationship, proportional equality (equity), and the common good ask what actors with dwarfism are owed, both fair access to work and portrayals that respect their dignity. Prudence, right deliberation in action, is needed to see the situation truthfully and to find the best means to a good end; it is practical and depends on context, not a single rule. Fortitude, facing challenges and difficulties well, applies because every choice here draws public criticism. Temperance, moderation of desires, pleasures, and emotions, is needed in the outrage and backlash on all sides, and in a studio’s desire for profit and safety.",
        a:["Disney needed prudence and justice most. Its good desire was to avoid stereotyping, but prudence would have seen truthfully that the problem lay in how the dwarfs were written, not in who played them. Justice gives what is due: under-represented actors are owed fair access to rare roles, and an audience that includes people with dwarfism is owed portrayals with dignity. Proportional equality (equity) matters because these actors start with far fewer opportunities. Choosing CGI looks like a failure of fortitude: Disney avoided the criticism instead of doing the harder work of re-imagining the characters with actors who have dwarfism.",
           "Peter Dinklage showed fortitude by using his fame to speak against stereotypes. Justice, though, asks him to remember that lesser-known actors depend on the very roles he criticized; prudence would aim his criticism at how the characters are written rather than at the casting itself.",
           "Lesser-known actors with dwarfism are owed justice in the form of fair opportunity, and they show fortitude by speaking up despite having less power and fame. Audiences need temperance in their reactions to recasting, whether of the dwarfs, Ariel, or Snow White, so that anger does not replace honest thought about what these stories are for."],
        r:"Disney was wrong to replace the dwarfs with CGI. The most virtuous response would have been to cast actors with dwarfism and work with them to rewrite the characters with dignity, so the film offered both fair employment and a portrayal free of mockery. This gives each group what it is due, which is what justice requires, and prudence shows that both goods could be achieved at once. Some would argue, with Peter Dinklage, that any casting of “seven dwarfs” repeats a stereotype, so removing the actors was the respectful choice. But the stereotype comes from the story’s writing, not from the actors’ bodies, and erasing them from the screen did not end the stereotype; it only took away rare work from people who already have the fewest roles." } },

  { id:"cs3", t:"Practice Case #3: Juan and Julia", tag:"Class practice case", cls:true,
    s:["Juan and his girlfriend Julia have just graduated from college and have been in a committed relationship for about two years. Their relationship is happy and healthy, characterized by mutual respect and excitement about their future together. One weekend, Juan goes on a trip by himself to the wedding of an old friend from high school. The party afterwards is a fun and raucous celebration. Towards the end of the evening, Juan finds himself dancing with Marcela, an old friend that he has not seen in a very long time. At first the dancing is silly, but soon they are dancing suggestively and flirting with each other. When the party is over, Marcela invites Juan back to her hotel room and he accepts.",
       "When Juan and Marcela arrive at the hotel, they are surprised to find that a handful of their old friends have gathered in the common area, continuing to catch up together. They welcome Juan and Marcela, who end up sitting with different clusters of friends scattered around the room, and they all continue talking and laughing until the morning.",
       "The next day, after everyone has parted ways, Juan feels glad the interaction with Marcela went no further than it did, but he also feels guilty about nearly cheating on Julia. He is not sure about what would have happened had his friends not been present. He is also not sure whether or not to tell Julia what happened. Juan thinks Julia deserves to know how close he came to cheating on her and that it would be disrespectful to her and to their relationship to keep it a secret. Yet he also wonders if telling Julia is necessary since in the end all he and Marcela did was dance."],
    h1:"Juan and Julia are obvious. Who else made choices that night, and who unknowingly changed how it ended?",
    h3:"Juan says “all we did was dance,” but he also accepted the invitation to the hotel room. What does his guilt tell you about his conscience, and what does it show about temperance?",
    m:{ p:"Should Juan tell Julia that he nearly cheated on her?",
        sec:["Juan’s flirting and accepting Marcela’s invitation","Marcela pursuing someone she may know is in a relationship","Honesty and trust in a committed relationship","Juan’s uncertainty about what he would have done"],
        st:["Juan","Julia","Marcela","Their friends at the hotel"],
        v:"Justice, giving what is due, is central because Juan and Julia are in a committed relationship, and right relationship creates duties: fidelity and honesty are owed to a partner. Temperance, self-control and moderation of desires, pleasures, and emotions, applies to what happened at the party, where desire overruled reason step by step; its stages (intemperance, incontinence, continence, temperance) help describe where Juan is. Prudence, right deliberation in action, is needed to see the night truthfully, including the role of conscience, and to decide how and when to tell Julia. Fortitude, facing challenges and difficulties well, is needed because telling the truth risks the relationship he values.",
        a:["Juan needs every virtue here. Temperance failed him at the party: the dancing moved from silly to suggestive, and accepting Marcela’s invitation was a real choice, not an accident. His guilt the next morning is his conscience working, a sign he is not at the stage of intemperance but closer to incontinence: he knows it was wrong and still acted. Justice asks what Julia is due, and Juan himself admits she deserves to know. Prudence helps him see truthfully: he does not know what would have happened, and “all we did was dance” is a story that protects him rather than the truth. Fortitude gives him the courage to have a hard conversation with someone he loves.",
           "Julia has done nothing wrong, and justice says she is owed honesty from the person she is building a future with. She will need prudence and temperance when she hears the truth, so that her response is proportionate, neither dismissing what happened nor treating it as if Juan had cheated.",
           "Marcela also lacked temperance, and she failed in justice if she knew Juan was in a relationship. The friends at the hotel acted without knowing it, but their presence shows how much our circumstances shape our choices, which is why prudence avoids the near occasion of a bad act instead of trusting willpower in the moment."],
        r:"Juan should tell Julia what happened, honestly and without excuses. Justice settles it: a committed relationship is built on right relationship and trust, and Julia is owed the truth so she can respond as a full partner rather than live inside a story Juan has edited for her. Telling her also builds a habit of honesty, while hiding it would build a habit of concealment that makes the next secret easier. Some would argue that nothing happened, so telling her would only cause pain. But Juan chose to go to the hotel room, he does not know what he would have done, and his own conscience says she deserves to know; silence would protect Juan’s comfort, not Julia’s good. Prudence can shape how he tells her, in person and soon, along with what he will change so it does not happen again." } },

  { id:"cs4", t:"Practice Case #4: The Golden State Killer", tag:"Class practice case", cls:true,
    s:["In 2018, authorities discovered the identity of the Golden State Killer—a man responsible for over 50 rapes, 13 murders, and countless home invasions that occurred in California during the 1970s and 1980s. Now 72 years old, Joseph DeAngelo had evaded police for over forty years until detectives ran crime scene DNA evidence against an online genealogy database that is ordinarily used to connect people to long-lost relatives. Using the Golden State Killer’s DNA profile, investigators found that an individual who had uploaded their DNA to the database was probably related to the killer. Then, after investigating that individual’s relatives who fit the description and age of the Golden State Killer, the detectives settled on DeAngelo as their prime suspect. The investigators then obtained a DNA sample from DeAngelo and constructed a genetic profile which turned out to be identical to that of the perpetrator. Although he is still awaiting trial, there is very little doubt that DeAngelo is in fact the Golden State Killer.",
       "Few people find the fact that DeAngelo has been arrested on the basis of DNA evidence to be problematic—if the district attorney’s office and its investigators made no errors in their procedures, then DeAngelo’s capture appears to be a clear victory for justice. What some find problematic, however, is the method that the police used to uncover the killer’s identity. Critics consider these methods to be a major breach of privacy. According to this criticism, someone’s DNA is the most private information about them. Police cannot just demand someone’s DNA without probable cause for thinking that they have committed a crime, and no one’s genetic information should be turned over to police without a warrant or without the owner’s explicit consent. People who upload their DNA to genealogy websites such as the one in question have consented to have their genetic information used for a very specific purpose—to find relatives. They have not given consent for this information to be used by the police. Therefore, using such a website to access someone’s private genetic information seems to be an illegitimate way for police to get access to information to which they do not have any right. This case could set a problematic precedent, encouraging further violations of civil rights by law enforcement officials.",
       "In defense of the investigators’ actions, some people deny that this was a major breach of privacy: voluntarily uploading your genetic information to a publicly-accessible database means that you give up any reasonable expectation of privacy related to it. Others argue that even if there was a breach in privacy in this case, it is one in which the benefits clearly outweigh the costs. After all, this particular case had been cold for forty years and probably wouldn’t have been solved if the detectives had not pursued this strategy. Locating criminals through genealogy websites could open the door to resolving countless previously unsolved cases. Still, opponents respond, the same argument could be made for violating any privacy rights; the ends do not justify the means."],
    h1:"Count the people whose DNA was involved, not just DeAngelo. Then add the victims and their families, the investigators, the website, and everyone who might upload DNA in the future.",
    h3:"Virtue ethics doesn’t stop at “the ends justify the means.” What is each person due here, and what would a prudent, just investigator do?",
    m:{ p:"Was it ethical for investigators to use a genealogy database, without its users’ consent, to identify the Golden State Killer?",
        sec:["Privacy and consent for genetic information","Justice for the victims and their families after forty years","The precedent for future police investigations and civil rights","Whether the ends justify the means"],
        st:["The investigators","The victims and their families","Joseph DeAngelo","The relative who uploaded their DNA, and the database’s other users","The genealogy company and the public"],
        v:"Justice, giving what is due, is the main virtue in this case, and here it pulls in more than one direction. Its key elements of right relationship, the common good, and what makes a law just (a dictate of reason, made by proper authority, properly promulgated, and serving the common good) ask what the victims are owed, what the database’s users are owed, and what even the accused is owed. Prudence, right deliberation in action, is needed to choose a means that fits the good end; it is not mechanistic and depends on context. Fortitude, facing challenges and difficulties well, shows in forty years of endurance by investigators and victims’ families. Temperance, moderation of desires, pleasures, and emotions, is needed so the desire for justice does not grow into a willingness to do anything to win it.",
        a:["The investigators need justice and prudence most. The victims and their families are owed justice, and the investigators showed fortitude by not giving up for forty years. But justice is also owed to the people whose DNA they searched: users who consented to find relatives, not to help the police. Prudence asks whether the means fit the end. Here the database was used only to generate a lead, and the decisive evidence came from DeAngelo’s own DNA, obtained afterward. Temperance keeps the strong desire to solve a terrible case from becoming a habit of ignoring others’ rights.",
           "The victims and their families showed great fortitude in enduring decades without answers, and they are owed justice: the truth and a fair trial. DeAngelo, though almost certainly guilty, is still owed a just process, because justice is not only for the innocent.",
           "The relative who uploaded their DNA and the other users are owed respect for what they agreed to. The genealogy company owes its users prudence and honesty: clear terms about whether police may search their data, so that their consent is real."],
        r:"In this case, the investigators acted justly enough to be defended, but the practice needs limits. The most virtuous response is to allow genealogy searches only for the gravest crimes, only to produce a lead that must then be confirmed through a lawfully obtained sample, and only under clear public rules that users are told about when they upload their DNA. This gives the victims the justice they are owed while respecting what users are owed: honest terms and real consent. Some would argue, with the critics, that the ends do not justify the means and that this sets a dangerous precedent. Virtue ethics agrees that the goodness of the end alone does not decide the question, which is why prudence demands narrow limits and justice demands transparency. But using information that people placed in a publicly searchable database, to find someone who raped and murdered for years, is not the same as seizing private data at will; a just and prudent society can allow it with clear rules rather than forbid it entirely." } },

  { id:"lights", t:"Lights Out", tag:"Dorm life",
    s:["Theo is a junior whose phone screen time averages over seven hours a day, most of it after lights-out. He runs a gaming commentary channel with 40,000 followers, and a sponsor pays him $300 a month as long as he streams four nights a week.",
       "His grades have dropped from A’s to C’s this semester, and he has fallen asleep twice in morning chapel. Last week he deleted the apps for two days and said he felt “lighter,” then reinstalled them when followers started asking where he went.",
       "His roommate, Omar, is a varsity swimmer with 6 a.m. practices. Omar says the light and noise keep him awake and has asked Theo to keep his phone out of the room after 11 p.m. Theo’s parents, who pay his tuition with help from financial aid, don’t know the channel exists. The dorm head has noticed Theo’s light on late and plans to talk to him on Friday."],
    h1:"Theo isn’t the only one affected by his phone. Who shares his room, pays for his school, and is responsible for his dorm?",
    h3:"What does it tell you that Theo felt “lighter” without the apps but reinstalled them anyway? Which of the four stages of temperance is that?",
    m:{ p:"Should Theo agree to keep his phone out of the room after 11 p.m., even if it costs him his sponsorship?",
        sec:["Theo’s falling grades and lack of sleep","Keeping the channel secret from his parents","Omar’s sleep before 6 a.m. practice","The dorm’s lights-out expectations"],
        st:["Theo","Omar","Theo’s parents","The dorm head","Theo’s followers and sponsor"],
        v:"Temperance, self-control and moderation of desires, pleasures, and emotions, is at the center of this case. Its key elements are the harmony of the soul and placing rationality over our desires; desire itself is good, but it must not displace more important goals. Prudence, right deliberation in action, is needed so Theo can see his situation truthfully and choose the best means to good goals. Justice, giving what is due, applies because Theo shares a room and a family, so his habits affect his right relationships with others. Fortitude, facing challenges and difficulties well, is needed to endure the loss of income and attention that change would bring.",
        a:["Theo needs temperance most. His desire for followers and the stream has displaced goals that matter more: sleep, school, and his health. Deleting the apps and feeling “lighter” shows he is at the stage of incontinence, aware the habit is wrong but still acting on it. Prudence asks him to see truthfully that C’s and falling asleep in chapel are the real cost. Justice requires him to give Omar a room where he can sleep before 6 a.m. practice, and to give his parents the honesty they are due, since they sacrifice for his education. Fortitude helps him endure losing $300 a month and some followers.",
           "Omar shows justice by asking for what he is due without harshness, and prudence by going to Theo first instead of straight to the dorm head. He may need fortitude to hold to his request if Theo pushes back.",
           "Theo’s parents and the dorm head both need justice when they learn the truth: a proportionate response that is neither lenient nor harsh. They also need prudence to help Theo form a better habit, not just punish a late light."],
        r:"Theo should agree to keep his phone out of the room after 11 p.m. and cut his streaming to hours that fit his schoolwork and sleep, even if he loses the sponsor. He should also tell his parents about the channel. Temperance is not about rejecting desire; streaming can be good, but right now it rules Theo instead of reason ruling it. Justice to Omar settles the question, because in a shared room Theo’s habit is not only his own. Some would argue that it is Theo’s time and money and the channel could become a career. But a habit that drops his grades and keeps his roommate awake is a vice whatever it earns, and a temperate Theo could still build the channel at reasonable hours." } },

  { id:"register", t:"Six Dollars Short", tag:"Work",
    s:["Dana, 19, works the register at a grocery store to pay for community college. A regular customer, a mother with two young kids, pays with her SNAP (EBT) card. Her benefits come up $6.40 short for a cart of milk, bread, eggs, apples, and a box of cereal.",
       "She starts putting items back, embarrassed, while the line grows. A man behind her mutters that “people on welfare should learn to budget.”",
       "Store policy forbids employees from paying for customers’ purchases at their own register, a rule meant to prevent fraud. Dana’s manager wrote her up last month when her drawer came up short. Dana has a ten-dollar bill in her apron from tips she earned carrying groceries to cars, and the tips are hers to keep."],
    h1:"Count everyone at that register, including the people in line. Is the store policy itself an issue worth naming?",
    h3:"Dana owes something to more than one person here. List what is due to the mother, the manager, and the man in line.",
    m:{ p:"Should Dana use her own money to cover the customer’s shortfall when store policy forbids it?",
        sec:["The mother’s dignity in front of the line","The man’s comment about people on welfare","Dana’s write-up last month","Whether the policy itself is just"],
        st:["Dana","The mother and her children","Dana’s manager and the store","The man in line and the other customers"],
        v:"Justice, giving what is due, is the main virtue here. Its key elements are right relationship and the common good, and in a case like this proportional equality (equity) and mercy matter too. Prudence, right deliberation in action, helps Dana see the whole situation truthfully and find the best means to a good desire. Temperance, moderation of desires, pleasures, and emotions, applies to the anger and embarrassment of the moment. Fortitude, facing challenges well, is needed to speak up in front of an impatient line.",
        a:["Dana owes justice in several directions: mercy and dignity to a mother trying to feed her kids, honesty to an employer whose rule exists to prevent fraud, and care for her own job after last month’s write-up. Prudence helps her see that the choice is not only “break the rule or send the kids home without cereal”; she can call the manager over and ask, openly, to cover it. Fortitude lets her do that, and respond to the man’s comment, with the whole line watching. Temperance keeps her irritation at him from turning into harshness.",
           "The mother shows fortitude by putting items back with her kids beside her instead of leaving. She is owed the dignity of not being shamed for using a program meant for exactly this.",
           "The man in line fails in justice: his comment withholds the respect every person is due, and his impatience shows a lack of temperance. The manager, if called, needs prudence to see that a rule meant to stop fraud is not threatened by an open, approved act of kindness."],
        r:"Dana should not quietly break the policy, but she should not let the moment pass either. The most virtuous response is to call the manager over, ask permission to cover the $6.40 from her tips, and tell the man calmly that the customer deserves respect. This keeps right relationship with her employer while giving the mother the mercy and dignity she is due. Some would argue that feeding children matters more than any store rule, so Dana should just pay. But justice includes honesty toward her employer, and prudence shows she can almost certainly help the family without deceiving anyone. If the manager refuses, Dana can still help once she is off the register." } },

  { id:"letters", t:"Two Acceptance Letters", tag:"Family",
    s:["Grace, a senior, has been admitted to two schools. Her dream school is a private university across the country, which would cost $38,000 a year after financial aid. Her state’s flagship university has offered her a full-tuition scholarship in its honors college.",
       "Her parents say they will “find a way” for the dream school, which would mean taking out a second mortgage on their house. Her younger brother is a freshman and will start college in four years. Grace wants to be a pediatrician, which means medical school, and medical school debt, after college.",
       "Her two best friends are going to the state school, and Grace honestly can’t tell whether she leans toward it for good reasons or because she is afraid of starting over somewhere new. The deposit deadline is May 1, nine days away."],
    h1:"Grace’s choice reaches beyond Grace. Who else will live with the cost of it, now and in four years?",
    h3:"What is Grace’s real goal, her telos here: a school, or a career as a pediatrician? How does prudence treat the schools if they are means to that end?",
    m:{ p:"Should Grace accept the full scholarship at the state honors college, or attend her dream school with a second mortgage?",
        sec:["Her parents’ finances and the second mortgage","Her brother’s college costs in four years","Future medical school debt","Whether fear of starting over is shaping her choice"],
        st:["Grace","Her parents","Her younger brother","Her friends"],
        v:"Prudence, right deliberation in action, is the main virtue in this decision. Its key elements are seeing truthfully, the role of conscience, and discerning how to achieve good desires. Justice, giving what is due, applies because her choice affects her right relationships with her parents and brother. Temperance, moderation of desires, pleasures, and emotions, helps her moderate both her desire for a dream school and her fear of a new place. Fortitude, facing challenges well, is needed whichever way she goes: to disappoint herself or her parents, or to start over somewhere new.",
        a:["Grace needs prudence above all. Her good desire is to become a pediatrician, and both schools are means to that end. Seeing truthfully means facing the numbers: $38,000 a year, a second mortgage, and medical school debt still to come. It also means honestly asking whether fear of starting over, rather than good reasons, is pulling her toward the state school. Justice reminds her that her parents’ offer is a gift and not something she is owed, and that her brother is owed a fair chance at college too. Temperance moderates her desire for the prestige of a “dream school.” Fortitude gives her courage to make the choice and live with it.",
           "Her parents show love and generosity, but they also need prudence to see their finances truthfully, including their son’s future, and fortitude to tell Grace honestly if the mortgage would strain the family.",
           "Her brother cannot speak in this decision, but justice still counts him. Grace’s friends should not decide it for her; leaning on them would be choosing comfort over prudence."],
        r:"Grace should accept the full scholarship at the state honors college. Prudence keeps her eyes on her telos: becoming a pediatrician. The honors college gets her there without debt that would follow her family for years. Justice to her parents and brother weighs against putting the family home at risk for a school’s name, and temperance moderates the desire for prestige. Some would argue that her parents freely offered and she only gets one shot at her dream. But the dream is to be a doctor, not to attend a particular school, and a generous offer does not make it prudent to accept. If, after honest reflection, fear were her only reason, she should talk it through again before May 1." } },

  { id:"peace", t:"Keeping the Peace", tag:"Relationships",
    s:["Jordan and Sam, both seniors, have been dating for ten months. Over the last few months Sam has started asking Jordan to share her location at all times, gets upset when she spends time with friends, and goes silent for a day or two when she doesn’t reply quickly.",
       "To “keep the peace,” Jordan has stopped going to Friday movie nights with her friends and dropped out of the school play. Her best friend, Ava, recently told her that Sam is “controlling” and that Jordan has “become a different person.”",
       "Jordan still cares about Sam and knows his parents are going through a difficult divorce. She is also afraid of being alone for the rest of senior year. Prom is in three weeks, and Sam has already bought the tickets."],
    h1:"Name the secondary issues hiding in the details: the play, Friday nights, Sam’s family, and the prom tickets.",
    h3:"Look back at the Virtue as Mean slides: love’s deficiency is selfishness and its excess is enablement. Where does “keeping the peace” fall?",
    m:{ p:"Should Jordan stay in her relationship with Sam?",
        sec:["Jordan giving up her friends and the school play","Sam’s family going through a divorce","Ava’s honesty and how Jordan receives it","The prom tickets"],
        st:["Jordan","Sam","Ava and Jordan’s friends"],
        v:"Fortitude, facing challenges and difficulties well, is central here. Its key elements are correct belief about what should be feared, our relationship to fear and hardship, and the choice between endurance and attack. Prudence, right deliberation in action, helps Jordan see truthfully what the relationship has become. Justice, giving what is due, applies to right relationship between Jordan and Sam and with her friends. Temperance, moderation of desires, pleasures, and emotions, applies to Sam’s jealousy and to Jordan’s fear and attachment.",
        a:["Jordan needs prudence to see truthfully: quitting the play and Friday nights is not peace, and Ava’s words that she has “become a different person” are evidence worth taking seriously. The telos of dating should be two people growing toward the good together. Fortitude needs correct belief about what to fear: being alone is a real fear, but losing who she is matters more. This calls for attack, an honest conversation, rather than enduring something that should not be endured. Justice means she owes Sam honesty and owes her friends the friendship she has let go. Temperance helps her moderate the fear and attachment that keep her silent.",
           "Sam lacks temperance in his emotions; jealousy and days of silence are emotions ruling him. His parents’ divorce explains some of this but does not excuse it. Tracking Jordan’s location does not give her what is due in a relationship: trust and freedom.",
           "Ava shows justice and fortitude by telling her friend a hard truth. She needs prudence in how she keeps saying it, so that Jordan hears care rather than harshness."],
        r:"Jordan should have an honest conversation with Sam now, naming the specific behaviors and asking for real change. If Sam will not change, she should end the relationship before prom, not after. In the Virtue as Mean slides, love sits between selfishness and enablement; staying silent to keep the peace is enablement, not love. Fortitude gives her the courage to act, and justice asks for honesty with both Sam and her friends. Some would argue that ending things during Sam’s parents’ divorce would be cruel. But Jordan can show mercy in how she speaks and still refuse to enable controlling behavior, and waiting until after prom would only avoid difficulty, not show kindness." } },

  { id:"council", t:"The Honor Council", tag:"School",
    s:["Elijah, a senior, sits on the student honor council. A junior, Marcus, has admitted taking $300 from the lacrosse team’s fundraiser cash box. He says he used it to pay for his younger sister’s prescription after his family’s insurance lapsed. He has already repaid $100 and offered to work off the rest.",
       "This is Marcus’s second honor offense; as a freshman he plagiarized an essay. The handbook says a second major offense “may result in dismissal.” Marcus is on full financial aid, so dismissal would also cost him his housing.",
       "The parents who ran the fundraiser are angry and want Marcus expelled. Elijah plays lacrosse with Marcus and likes him. The council votes tomorrow, and Elijah’s vote may decide the outcome."],
    h1:"Elijah’s friendship with Marcus is an issue in its own right. What else is at stake for the school community, not just Marcus?",
    h3:"Use the Week 8 key parts of justice: proportional equality (equity), right relationship, the common good, and mercy and redemption. Which apply to Marcus, and which to the parents?",
    m:{ p:"Should Elijah vote to recommend that Marcus be dismissed?",
        sec:["Elijah’s friendship with Marcus and his impartiality","The parents’ demand for expulsion","Marcus’s family situation and his sister’s prescription","Marcus’s first offense and what a proportional consequence looks like"],
        st:["Elijah","Marcus","Marcus’s sister and family","The lacrosse team and its parents","The honor council and the school community"],
        v:"Justice, giving what is due, is at the heart of this case. Its key elements are proportional equality (equity), right relationship, the common good, and mercy and redemption, with leniency and harshness as its vices. Prudence, right deliberation in action, helps Elijah see the whole situation truthfully. Fortitude, facing challenges well, is needed to vote for what is just under pressure. Temperance, moderation of desires, pleasures, and emotions, keeps both his affection for Marcus and the parents’ anger from deciding the case.",
        a:["Elijah’s main virtue is justice. The consequence should be proportional: Marcus stole $300, has repaid $100, and this is his second offense. Doing nothing would be leniency; dismissal, which also costs a student on aid his housing, may be harshness. Prudence means seeing both the theft and the reason for it, and disclosing his friendship to the council so his vote can be trusted. Temperance keeps his friendship and the parents’ anger from steering him. Fortitude lets him vote for what he believes is just even if teammates or parents are upset.",
           "Marcus failed in justice by taking what was not his and in prudence by not asking the school for help. But confessing, repaying $100, and offering to work off the rest are the beginning of redemption and of restoring right relationship.",
           "The parents are owed repayment and a real response, and their anger is understandable. Justice asks for proportion, not revenge, and temperance asks them to moderate their emotions. The school community’s common good needs both trust in its fundraisers and a council that can restore someone who has done wrong."],
        r:"Elijah should disclose his friendship with Marcus and then vote against dismissal, recommending a serious, restorative consequence instead: full repayment, service hours, suspension from lacrosse, and a clear final warning. This is proportional and leaves room for mercy and redemption while still treating the theft seriously, so it is not leniency. Some would argue that this is a second offense, the handbook allows dismissal, and going easy invites more theft. But the handbook says “may,” which leaves room for prudence. The consequence is costly and real, and dismissal would also punish his sister and family. The common good is served when wrongdoing is answered and the person is restored to right relationship." } },

  { id:"lab", t:"The Missing Data", tag:"Science",
    s:["Priya, 22, is a lab assistant in a university lab testing a new asthma medication. While preparing figures for a paper, she notices that her supervisor, Dr. Hale, removed three patients from the results. Their data made the drug look less effective, and there is no note explaining why they were removed.",
       "The paper is due to a journal in one week, and a large grant renewal depends on it. Priya is applying to medical school, and her application relies on a strong recommendation letter from Dr. Hale.",
       "When she mentions it to a postdoc, he shrugs: “Everyone cleans data. Don’t make this your problem.” The university has an anonymous research-integrity office. Priya is not certain the removal was improper; there could be a medical reason she doesn’t know about."],
    h1:"Who is affected by a published drug study besides the people in the lab?",
    h3:"Priya isn’t certain anything wrong happened. How does prudence (seeing truthfully) shape what fortitude asks of her first?",
    m:{ p:"What should Priya do about the patients removed from the study?",
        sec:["Her medical school recommendation letter","The lab’s grant renewal","The postdoc’s claim that “everyone cleans data”","Uncertainty about whether there was a medical reason"],
        st:["Priya","Dr. Hale","The postdoc and the lab team","Future patients who would take the drug","The university and the scientific community"],
        v:"Fortitude, facing challenges and difficulties well, is central: correct belief about what to fear, our relationship to fear and hardship, and the choice between attack and endurance. Prudence, right deliberation in action, applies through seeing truthfully and the role of conscience. Justice, giving what is due, applies to future patients, to science, and to Dr. Hale, who is owed a fair hearing. Temperance, moderation of desires, pleasures, and emotions, keeps her ambition and fear in check.",
        a:["Priya needs prudence first. She is not certain anything improper happened, so seeing truthfully means finding out whether there was a medical reason before accusing anyone, while still listening to her conscience. Justice: future patients are owed honest results about a drug they will take, and Dr. Hale is owed a fair hearing. Fortitude requires correct belief about what to fear: losing a letter is a real loss, but less serious than patients relying on false data. Here that means attack, asking directly, rather than quietly enduring. Temperance keeps her desire for medical school from overruling all of this.",
           "Dr. Hale owes justice to patients and to science, and the pressure of the grant tests his temperance. If the removal was not justified, his desire for funding has displaced a far more important goal.",
           "The postdoc shows a lack of fortitude and justice. “Everyone cleans data” is how vicious habits become normal in a community, and his advice puts the lab’s comfort ahead of what patients are due."],
        r:"Priya should ask Dr. Hale directly and respectfully why the three patients were removed and ask that the reason be documented in the paper. If there is no legitimate reason, she should report it to the research-integrity office, even if it costs her the recommendation letter. Asking first is prudence; acting on the answer is fortitude; and both serve justice to the patients who will rely on this study. Some would argue that she might be wrong and could ruin her career over a misunderstanding. But that is exactly why she asks first, which is courage guided by prudence rather than rashness. And a future doctor who stays silent about bad data for a drug would betray the very purpose of medicine." } },

  { id:"tradition", t:"The Tradition", tag:"Dorm life",
    s:["Every fall in Birch House, the seniors hold “Freshman Olympics” the night before the first home game. Freshmen wear costumes the seniors pick, eat spoonfuls of hot sauce, and sing the school fight song in the dining hall while seniors film it. The videos end up on a private account that the whole dorm follows. Seniors call it “the best night of the year” and point out that they all went through it as freshmen.",
       "This year, a freshman named Leo quietly told Ben, one of six senior proctors, that he has been dreading it and asked whether he has to go. The other five proctors want to keep the tradition exactly as it is and say “nobody actually gets hurt.” The dorm head, an adult, has never asked about it.",
       "Ben is also running for head proctor next semester, and the other proctors’ votes count heavily in that decision."],
    h1:"A tradition affects more than the people in the room. Think about the videos, the dorm head, and the freshmen who haven’t said anything.",
    h3:"A tradition is a community’s habit. What do the other proctors’ words “nobody actually gets hurt” and “we went through it too” reveal about their virtues?",
    m:{ p:"Should Ben try to stop or change Freshman Olympics?",
        sec:["The videos on a private account","Leo’s request to sit out","Ben’s head proctor election","The dorm head not knowing what happens"],
        st:["Ben","Leo and the other freshmen","The other senior proctors","The dorm head","The Birch House community"],
        v:"Fortitude, facing challenges and difficulties well, is central to Ben’s choice. Its key elements are correct belief about what to fear and the choice between attack and endurance. Justice, giving what is due, applies through right relationship in the dorm community and the dignity owed to each freshman. Prudence, right deliberation in action, helps Ben find the best means of changing things. Temperance, moderation of desires, pleasures, and emotions, applies to the seniors’ desire to relive their night and to Ben’s own desire to be liked and elected.",
        a:["Ben needs fortitude: speaking up may cost him the head proctor vote. That is a real risk, but correct belief tells him it is less important than freshmen being humiliated on camera. Justice means that, as a proctor, he owes the freshmen protection and dignity, owes the other proctors honesty, and owes the dorm head the truth if it comes to that. Prudence helps him find the best means, such as proposing a version of the night that keeps the fun and bonding without humiliation. Temperance moderates his own desire to be popular.",
           "The other proctors lack temperance: their desire to repeat “the best night of the year” is overruling reason. “We went through it too” shows how a community’s habit can become a vice, and “nobody actually gets hurt” ignores what Leo has told Ben, a failure of justice.",
           "Leo shows fortitude and prudence by going to a proctor he trusts. The dorm head owes the community justice through oversight, and prudence would have asked about the night long ago."],
        r:"Ben should propose that the proctors keep the night but drop the hot sauce, the filming, and any costume a freshman doesn’t choose, and make it opt-in. He should tell Leo that he does not have to take part. If the other proctors refuse, Ben should tell the dorm head before the night happens. This is justice to the freshmen, prudence in seeking change before going over anyone’s head, and fortitude in accepting the cost. Some would argue that it is harmless bonding and that freshmen who skip it will be left out. But bonding does not require humiliation, a filmed video lasts long after the night ends, and the greater the cost to Ben, the greater the fortitude his choice shows." } }
];

const vchip = k => { const v = VIRTUES.find(x => x.k === k); return `<span class="chip v-${k}">${esc(v.n)}</span>`; };
const unitSwitch = u => `<nav class="unit-switch" aria-label="Choose a unit">${[["u1","unit1","Unit 1","Foundations"],["u2","unit2","Unit 2","Virtue Ethics"],["u3","unit3","Unit 3","Normative Theories"]].map(([k, h, n, l]) => `<a href="#${h}" ${u === k ? 'aria-current="page"' : ""}><b>${n}</b> ${l}</a>`).join("")}</nav>`;

function virtueCard(v){
  return `<article class="vcard v-${v.k}">
    <div class="vcard-head"><h2>${esc(v.n)}</h2><p class="vdef">${esc(v.d)}</p></div>
    <div class="stack" style="gap:6px"><span class="eyebrow">Essential characteristics</span>
      <ul class="charlist">${v.ch.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
    ${v.ch2 ? `<div class="stack" style="gap:6px"><span class="eyebrow">More elements</span>
      <ul class="charlist more2">${v.ch2.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
    <div class="meanrow" aria-label="The mean">
      <div><span class="lab">Deficiency</span><b>${esc(v.lo)}</b></div>
      <div class="mid"><span class="lab">Virtue</span><b>${esc(v.n)}</b></div>
      <div><span class="lab">Excess</span><b>${esc(v.hi)}</b></div></div>
    <ul class="more">${v.more.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
    <div class="voices">${v.voices.map(([w, q]) => `<p><span class="who">${esc(w)}</span> ${esc(q)}</p>`).join("")}</div>
    <p class="role"><span class="eyebrow">With the other virtues</span>${esc(v.role)}</p>
  </article>`;
}
function quickRef(){
  return `<details class="quickref"><summary>Quick reference: the four cardinal virtues</summary>
    <div class="qr-grid">${VIRTUES.map(v => virtueOpen(v.k) ? `<div class="qr v-${v.k}"><b>${esc(v.n)}</b><span>${esc(v.d)}</span><small>${v.ch.map(esc).join(" · ")}</small>${v.ch2 ? `<small class="muted">Also: ${v.ch2.map(esc).join(" · ")}</small>` : ""}<small class="muted">${esc(v.lo)} ← → ${esc(v.hi)}</small></div>` : `<div class="qr v-${v.k}"><b>${esc(v.n)}</b><span class="muted">${LOCK} Locked. Open it in the <a href="#toolkit">Virtue Toolkit</a> by writing your own notes.</span></div>`).join("")}</div>
    <p class="muted" style="margin-top:8px">Full notes are in the <a href="#toolkit">Virtue Toolkit</a>.</p></details>`;
}
function modelStep(c, n){
  const m = c.m;
  if (n === 1) return `<p><b>Primary issue:</b> ${esc(m.p)}</p>
    <p><b>Secondary issues</b></p><ul>${m.sec.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <p><b>Key stakeholders</b></p><ul>${m.st.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
  if (n === 2) return `<p>${esc(m.v)}</p>`;
  if (n === 3) return m.a.map(p => `<p>${esc(p)}</p>`).join("");
  return `<p>${esc(m.r)}</p>`;
}
const modelLabel = c => c.teacher ? "Teacher’s sample answer" : "Model answer";
function caseCard(c, open = true){
  return `<details class="case-card panel" ${open ? "open" : ""}><summary><span class="eyebrow">${esc(c.tag)} · Case ${VCASES.indexOf(c) + 1} of ${VCASES.length}</span><h2>${esc(c.t)}</h2></summary>
    <div class="case-body">${c.s.map(p => `<p>${esc(p)}</p>`).join("")}</div></details>`;
}
