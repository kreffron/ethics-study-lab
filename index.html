/* ---- Toolkit ---- */
V.toolkit = {
  init(){ S = { msg:{}, vd:{}, vc:{}, edit:{} }; },
  render(){
    P.vnotes = P.vnotes || {};
    const opened = VIRTUES.filter(v => virtueOpen(v.k)).length, gate = gated() && GATES.toolkitNotes;
    view.innerHTML = `<div class="view-head"><span class="eyebrow">Unit 2 · Reference</span><h1>Virtue Toolkit</h1>
        <p>Everything you need for Step 2 of a case study: the class definition of each cardinal virtue, its essential characteristics, its vices, and how it works with the others.</p></div>
      ${gate ? `<div class="feedback hint notes-first"><b>Notes first</b>Each virtue opens after you write its definition and at least two of its characteristics from your own notes. Then compare what you wrote with the class version. <span class="num">${opened} of 4 open.</span></div>` : ""}
      <dl class="basics">${VIRTUE_BASICS.map(([t, d]) => `<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl>
      <div class="vgrid">${VIRTUES.map(v => virtueOpen(v.k) && !S.edit[v.k] ? this.openCard(v) : this.lockCard(v)).join("")}</div>`;
  },
  openCard(v){
    const n = P.vnotes[v.k];
    return `<div class="vwrap">${n && n.def ? `<div class="yournotes v-${v.k}"><div class="row between"><span class="eyebrow">Your notes</span><button class="btn sm" type="button" data-act="vedit" data-k="${v.k}">Edit my notes</button></div>
      <p><b>Definition:</b> ${esc(n.def)}</p><p class="pre"><b>Characteristics:</b> ${esc(n.chars)}</p></div>` : ""}${virtueCard(v)}</div>`;
  },
  lockCard(v){
    const n = P.vnotes[v.k] || {}, d = S.vd[v.k] ?? n.def ?? "", c = S.vc[v.k] ?? n.chars ?? "", m = S.msg[v.k];
    return `<article class="vcard v-${v.k} lockcard"><div class="row between"><h2>${esc(v.n)}</h2>${S.edit[v.k] ? "" : `<span class="lockpill">${LOCK} Locked</span>`}</div>
      <p class="muted">${S.edit[v.k] ? "Update your notes, then save." : "Before you look, write it from your own notes."}</p>
      <label class="fl" for="vn-def-${v.k}">Definition<input type="text" id="vn-def-${v.k}" data-vd="${v.k}" value="${esc(d)}" autocomplete="off" spellcheck="false"></label>
      <label class="fl" for="vn-ch-${v.k}">At least two characteristics or elements<textarea id="vn-ch-${v.k}" data-vc="${v.k}" rows="3" placeholder="One per line">${esc(c)}</textarea></label>
      ${m ? `<p class="miss" role="status">${m}</p>` : ""}
      <div class="row end"><button class="btn primary" type="button" data-act="vcheck" data-k="${v.k}">${S.edit[v.k] ? "Save my notes" : "Check and open"}</button></div></article>`;
  },
  click(act, el){
    const k = el.dataset.k;
    if (act === "vedit") { S.edit[k] = true; }
    if (act === "vcheck") {
      const d = (S.vd[k] ?? $("#vn-def-" + k).value), c = (S.vc[k] ?? $("#vn-ch-" + k).value);
      const r = checkVirtueNotes(k, d, c);
      if (!gated() || (r.defOk && r.chars >= 2)) { P.vnotes[k] = { def:d.trim(), chars:c.trim(), open:1 }; saveP(); delete S.msg[k]; delete S.edit[k]; delete S.vd[k]; delete S.vc[k]; }
      else S.msg[k] = `Definition: ${r.defHave} of ${r.defNeed} key words from the class definition${r.defOk ? " ✓" : ""}. Characteristics: ${r.chars >= 2 ? "✓" : `add at least two from class (I recognized ${r.chars})`}. Check your notes and try again.`;
    }
    this.render();
  },
  input(e){ const t = e.target; if (t.dataset.vd) S.vd[t.dataset.vd] = t.value; if (t.dataset.vc) S.vc[t.dataset.vc] = t.value; }
};

/* ---- Virtue Case Lab ---- */
const blankDraft = () => ({1:"",2:"",3:"",4:""});
V.vlab = {
  init(){ S = { ci:0, mode:"steps", step:1, hints:{}, checks:{}, revealed:{}, mins:30, left:0, timer:null, started:false }; },
  stop(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } },
  c(){ return VCASES[S.ci]; },
  key(){ return S.mode === "bluebook" ? "bb" : "st"; },
  draft(){ P.u2 = P.u2 || {}; const c = this.c(); P.u2[c.id] = P.u2[c.id] || {}; return P.u2[c.id][this.key()] = P.u2[c.id][this.key()] || blankDraft(); },
  render(){
    const c = this.c();
    const head = `<div class="view-head"><span class="eyebrow">Unit 2 · Case Study Practice</span><h1>Virtue Case Lab</h1>
      <p>Use the four-step method from class. Your writing saves in this browser as you go.</p></div>`;
    const picker = `<div class="case-pick" role="group" aria-label="Choose a case">${VCASES.map((x, i) => `<button type="button" data-act="case" data-i="${i}" aria-pressed="${i === S.ci}">${esc(x.t)}${P.u2done && P.u2done[x.id] ? ' <span class="d" aria-label="completed">✓</span>' : ""}</button>`).join("")}</div>`;
    const modes = `<div class="tabs" role="group" aria-label="Practice mode">${[["steps","Step by step"],["pairs","Pairs"],["bluebook","Blue book (timed)"]].map(([k, l]) => `<button type="button" data-act="mode" data-v="${k}" aria-pressed="${S.mode === k}">${l}</button>`).join("")}</div>`;
    let body;
    if (S.mode === "pairs") body = this.pairs(c);
    else if (S.mode === "bluebook") body = this.bluebook(c);
    else body = S.step === 5 ? this.compare(c) : this.steps(c);
    view.innerHTML = head + `<div class="stack">${picker}<div class="row between">${modes}</div>${body}</div>`;
  },
  stepper(){
    return `<ol class="stepper">${STEPS.map(s => `<li><button type="button" data-act="go" data-n="${s.n}" aria-current="${S.step === s.n ? "step" : "false"}"><span class="num">${s.n}</span><span class="lbl">${esc(s.t)}</span></button></li>`).join("")}
      <li><button type="button" data-act="go" data-n="5" aria-current="${S.step === 5 ? "step" : "false"}"><span class="num">${this.ready() ? "✓" : LOCK}</span><span class="lbl">Compare</span></button></li></ol>`;
  },
  prompts(s){ return `<ul class="prompts">${s.q.map(q => `<li>${esc(q)}</li>`).join("")}</ul>`; },
  steps(c){
    const s = STEPS[S.step - 1], d = this.draft();
    const hint = S.step === 1 ? c.h1 : S.step === 3 ? c.h3 : null;
    const hk = c.id + S.step;
    return caseCard(c) + this.stepper() + `<section class="panel stack" aria-labelledby="step-title">
        <div class="row between"><span class="eyebrow">Step ${s.n} of 4</span>${hint ? `<button class="btn sm" type="button" data-act="hint" data-k="${hk}">${S.hints[hk] ? "Hide hint" : "Need a hint?"}</button>` : ""}</div>
        <h2 id="step-title" class="step-h">${esc(s.t)}</h2>
        ${this.prompts(s)}
        <p class="muted">${esc(s.tip)}</p>
        ${hint && S.hints[hk] ? `<div class="feedback hint"><b>Hint</b>${esc(hint)}</div>` : ""}
        ${S.step === 2 || S.step === 3 ? quickRef() : ""}
        <label class="fl" for="u2-ans-${s.n}">Your answer<textarea id="u2-ans-${s.n}" data-step="${s.n}" rows="${s.n === 1 ? 6 : 8}">${esc(d[s.n])}</textarea></label>
        ${this.counter(s.n, d[s.n])}
        <div class="row between"><button class="btn" type="button" data-act="go" data-n="${S.step - 1}" ${S.step === 1 ? "disabled" : ""}>← Back</button>
          <button class="btn primary" type="button" data-act="go" data-n="${S.step + 1}">${S.step === 4 ? "Compare with the model →" : "Next step →"}</button></div>
      </section>`;
  },
  counter(n, t){ if (!gated()) return ""; const w = wc(t), m = GATES.caseMinWords[n]; return `<span class="wcount${w >= m ? " ok" : ""}" id="wc-${n}">${w} / ${m} words${w >= m ? " ✓" : " to open the model answer"}</span>`; },
  ready(){ const d = this.draft(); return !gated() || STEPS.every(s => wc(d[s.n]) >= GATES.caseMinWords[s.n]); },
  lockPanel(c){
    const d = this.draft();
    return caseCard(c, false) + (S.mode === "steps" ? this.stepper() : "") + `<section class="panel stack lockpanel">
      <span class="lockpill">${LOCK} Model answer locked</span><h2 class="step-h">Write your own answer first</h2>
      <p class="muted">The model answer opens once every step has enough of your own writing. These are minimums, not targets; a strong blue book answer is fuller.</p>
      <ul class="wlist">${STEPS.map(s => { const n = wc(d[s.n]), m = GATES.caseMinWords[s.n]; return `<li class="${n >= m ? "ok" : ""}"><span>Step ${s.n} · ${esc(s.t)}</span><span class="num">${n} / ${m} words${n >= m ? " ✓" : ""}</span>${n < m && S.mode === "steps" ? `<button class="btn sm" type="button" data-act="go" data-n="${s.n}">Write it</button>` : ""}</li>`; }).join("")}</ul>
      ${S.mode === "bluebook" ? `<div class="row"><button class="btn" type="button" data-act="unfinish">Back to writing</button></div>` : ""}</section>`;
  },
  compare(c){
    if (!this.ready()) return this.lockPanel(c);
    const d = this.draft(), ck = S.checks[c.id] || {};
    const got = Object.values(ck).filter(Boolean).length;
    return caseCard(c, false) + (S.mode === "steps" ? this.stepper() : "") + `
      <p class="muted">Read the ${c.teacher ? "teacher’s sample" : "model answer"} next to yours, step by step. It shows one strong answer at about blue book length; yours can reach a different conclusion if you defend it well.</p>
      ${STEPS.map(s => `<section class="compare-step"><h2 class="step-h"><span class="num">${s.n}</span>${esc(s.t)}</h2>
        <div class="compare">
          <div class="yours"><span class="eyebrow">Your answer</span>${d[s.n].trim() ? `<div class="pre">${esc(d[s.n])}</div>` : `<p class="muted">You didn’t write anything for this step.</p>`}</div>
          <div class="model"><span class="eyebrow">${modelLabel(c)}</span>${modelStep(c, s.n)}</div>
        </div></section>`).join("")}
      <section class="panel stack"><div class="row between"><span class="eyebrow">Check your work</span><b class="num" id="ckcount">${got} / ${RUBRIC.length}</b></div>
        <div class="checks">${RUBRIC.map(([n, l], i) => `<label><input type="checkbox" id="u2chk-${i}" data-act="check" data-i="${i}" ${ck[i] ? "checked" : ""}><span><span class="muted">Step ${n} ·</span> ${esc(l)}</span></label>`).join("")}</div>
        <div class="row between"><button class="btn" type="button" data-act="restart">Clear my answers</button><button class="btn primary" type="button" data-act="next">Next case →</button></div>
      </section>`;
  },
  pairs(c){
    return `<ol class="routine"><li><b>Break into pairs.</b></li><li><b>Read</b> (and annotate?) the case study.</li><li>Use the <b>whiteboards</b> to answer Steps 1 and 2.</li><li><b>Discuss</b> your answers to Steps 3 and 4.</li></ol>` +
      caseCard(c) + quickRef() +
      STEPS.map(s => { const k = c.id + s.n; return `<section class="panel stack">
        <div class="row between"><span class="eyebrow">Step ${s.n} · ${s.n <= 2 ? "Whiteboard" : "Discuss"}</span>
          <span class="row">${gated() && !S.revealed[k] ? `<label class="toggle sm"><input type="checkbox" id="pw-${k}" data-act="pw" data-k="${k}" ${S.pw && S.pw[k] ? "checked" : ""}> We’ve written ours</label>` : ""}<button class="btn sm" type="button" data-act="reveal" data-k="${k}" ${gated() && !S.revealed[k] && !(S.pw && S.pw[k]) ? "disabled" : ""}>${S.revealed[k] ? "Hide model" : "Reveal model"}</button></span></div>
        <h2 class="step-h">${esc(s.t)}</h2>${this.prompts(s)}
        ${S.revealed[k] ? `<div class="model"><span class="eyebrow">${modelLabel(c)}</span>${modelStep(c, s.n)}</div>` : ""}
      </section>`; }).join("");
  },
  bluebook(c){
    if (S.bbDone) return this.compare(c);
    if (!S.started) return `<section class="panel stack" style="text-align:center;justify-items:center">
        <span class="eyebrow">Blue book practice</span><h2 class="step-h">Write the whole case study, timed</h2>
        <p class="muted" style="max-width:52ch">Like the real thing: one case, all four steps, no hints or toolkit. The case appears when you start the clock. This attempt is saved separately from step-by-step practice.</p>
        <div class="tabs" role="group" aria-label="Time limit">${[20,30,40].map(m => `<button type="button" data-act="mins" data-v="${m}" aria-pressed="${S.mins === m}">${m} minutes</button>`).join("")}</div>
        <button class="btn primary" type="button" data-act="start">Start the clock</button></section>`;
    const d = this.draft();
    return `<div class="bb-bar"><span class="eyebrow">Blue book · ${esc(c.t)}</span><span class="timer${S.left <= 60 ? " low" : ""}" id="bbtimer" aria-live="off">${fmt(S.left)}</span></div>` +
      caseCard(c) + STEPS.map(s => `<section class="panel stack"><h2 class="step-h"><span class="num">${s.n}</span>${esc(s.t)}</h2>${this.prompts(s)}
        <label class="fl" for="u2-bb-${s.n}">Step ${s.n}<textarea id="u2-bb-${s.n}" data-step="${s.n}" rows="${s.n === 1 ? 5 : 7}">${esc(d[s.n])}</textarea></label>${this.counter(s.n, d[s.n])}</section>`).join("") +
      `<div class="row end"><button class="btn primary" type="button" data-act="finish">Finish and compare</button></div>`;
  },
  markDone(){ const c = this.c(); const d = this.draft(); if (this.ready() && Object.values(d).some(x => x.trim())) { P.u2done = P.u2done || {}; P.u2done[c.id] = 1; } saveP(); },
  click(act, el){
    const c = this.c();
    if (act === "case") { this.stop(); Object.assign(S, { ci:+el.dataset.i, step:1, started:false, bbDone:false }); }
    if (act === "mode") { this.stop(); Object.assign(S, { mode:el.dataset.v, step:1, started:false, bbDone:false }); }
    if (act === "go") { const n = +el.dataset.n; if (n < 1) return; S.step = n; if (n === 5) this.markDone(); }
    if (act === "hint") S.hints[el.dataset.k] = !S.hints[el.dataset.k];
    if (act === "reveal") S.revealed[el.dataset.k] = !S.revealed[el.dataset.k];
    if (act === "check") { S.checks[c.id] = S.checks[c.id] || {}; S.checks[c.id][el.dataset.i] = el.checked;
      const n = Object.values(S.checks[c.id]).filter(Boolean).length; const b = $("#ckcount"); if (b) b.textContent = n + " / " + RUBRIC.length; return; }
    if (act === "restart") { if (el.dataset.armed) { P.u2[c.id][this.key()] = blankDraft(); saveP(); S.step = 1; S.bbDone = false; S.started = false; S.checks[c.id] = {}; } else { el.dataset.armed = 1; el.textContent = "Click again to clear"; return; } }
    if (act === "next") { this.stop(); Object.assign(S, { ci:(S.ci + 1) % VCASES.length, step:1, started:false, bbDone:false }); }
    if (act === "mins") S.mins = +el.dataset.v;
    if (act === "start") { S.started = true; S.left = S.mins * 60; this.stop();
      S.timer = setInterval(() => { if (V.current !== "vlab") return this.stop(); S.left = Math.max(0, S.left - 1);
        const t = $("#bbtimer"); if (t) { t.textContent = S.left ? fmt(S.left) : "Time"; t.classList.toggle("low", S.left <= 60); }
        if (!S.left) this.stop(); }, 1000); }
    if (act === "finish") { this.stop(); S.bbDone = true; this.markDone(); }
    if (act === "unfinish") { S.bbDone = false; }
    if (act === "pw") { S.pw = S.pw || {}; S.pw[el.dataset.k] = el.checked; }
    this.render();
    if (["go","next","case","finish","start"].includes(act)) window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  },
  input(e){ const n = e.target.dataset.step; if (!n) return; this.draft()[n] = e.target.value; clearTimeout(this._t); this._t = setTimeout(saveP, 400);
    const w = $("#wc-" + n); if (w) { const k = wc(e.target.value), m = GATES.caseMinWords[n]; w.textContent = `${k} / ${m} words${k >= m ? " ✓" : " to open the model answer"}`; w.classList.toggle("ok", k >= m); } }
};
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

/* ================= UNIT 2 DRILLS ================= */
const VK = ["pru","jus","tem","for"];
const vname = k => VIRTUES.find(v => v.k === k).n;

/* Definition recall: key words that must appear */
const RECALL = [
  { k:"pru", n:"Prudence", ans:"Right deliberation in action", need:[["right"],["deliberation","deliberate"],["action","act"]] },
  { k:"tem", n:"Temperance", ans:"Self-control/moderation of desires, pleasures, and emotions", need:[["self-control","self control","selfcontrol","moderation","moderate","moderating"],["desires","desire"],["pleasures","pleasure"],["emotions","emotion"]] },
  { k:"for", n:"Fortitude", ans:"Facing difficulties/challenges well", need:[["facing","face"],["difficulties","difficulty","challenges","challenge"],["well"]] },
  { k:"jus", n:"Justice", ans:"Giving what is due", need:[["giving","give","gives"],["due"]] },
  { k:"vir", n:"Virtue", ans:"A stable and effective disposition oriented towards right action", need:[["stable"],["effective"],["disposition"],["oriented","orientation"],["right action","right actions"]] }
];

/* Characteristics sort: k = correct virtue(s) */
const TRAITS = [
  ["Seeing truthfully",["pru"]],["The role of conscience",["pru"]],["Discerning how we achieve good desires",["pru"]],
  ["Not mechanistic rules: context is essential",["pru"]],["The charioteer that guides the other virtues",["pru"]],

V.defs = {
  init(){ this.newRound(); },
  newRound(){
    const items = [];
    shuffle(VK).forEach(k => items.push({ type:"n2d", k }));
    shuffle(VK).forEach(k => items.push({ type:"d2n", k }));
    S = { stage:"match", items: shuffle(items), i:0, picked:null, score:0, recall:{}, checked:false };
  },
  def(k){ return RECALL.find(r => r.k === k).ans; },
  render(){
    const head = `<div class="view-head"><span class="eyebrow">Unit 2 · Definitions</span><h1>Definition Drill</h1>
      <p>First match each virtue to its definition, then write all four from memory. Step 2 of every case study starts here.</p></div>`;
    const tabs = `<div class="tabs" role="group" aria-label="Drill part"><button type="button" data-act="stage" data-v="match" aria-pressed="${S.stage !== "recall"}">1 · Match</button><button type="button" data-act="stage" data-v="recall" aria-pressed="${S.stage === "recall"}">2 · Write from memory</button></div>`;
    if (S.stage === "recall") { view.innerHTML = head + `<div class="stack">${tabs}${this.recallView()}</div>`; return; }
    if (S.stage === "done") {
      view.innerHTML = head + `<div class="stack">${tabs}<div class="panel stack" style="text-align:center;justify-items:center"><span class="eyebrow">Matching complete</span>
        <div class="scorebig num">${S.score}/${S.items.length}</div><p class="muted">Now write them from memory, the way you will in your blue book.</p>
        <div class="row" style="justify-content:center"><button class="btn" type="button" data-act="again">Match again</button><button class="btn primary" type="button" data-act="stage" data-v="recall">Write from memory →</button></div></div></div>`;
      return;
    }
    const it = S.items[S.i], done = S.picked !== null;
    const opts = it.type === "n2d" ? VK.map(k => ({ k, l:this.def(k) })) : VK.map(k => ({ k, l:vname(k) }));
    const prompt = it.type === "n2d" ? `What is the definition of <b class="v-${it.k} vtxt">${esc(vname(it.k))}</b>?` : `Which virtue is defined as “${esc(this.def(it.k))}”?`;
    view.innerHTML = head + `<div class="stack">${tabs}
      <div class="stats"><span>Question <b>${S.i + 1}</b> of <b>${S.items.length}</b></span><span>Score <b>${S.score}</b></span></div>
      <div class="progress" aria-hidden="true"><span style="width:${(S.i + (done ? 1 : 0)) / S.items.length * 100}%"></span></div>
      <div class="panel stack"><p class="q-text">${prompt}</p>
        <div class="opts">${opts.map((o, n) => { let cls = "opt"; if (done) cls += o.k === it.k ? " right" : o.k === S.picked ? " wrong" : " dim";
          return `<button type="button" class="${cls}" data-act="pick" data-k="${o.k}" ${done ? "disabled" : ""}><span class="k">${"ABCD"[n]}</span><span>${esc(o.l)}</span></button>`; }).join("")}</div>
        ${done ? `<div class="feedback${S.picked === it.k ? "" : " no"}" role="status"><b>${S.picked === it.k ? "Correct." : "Not quite."}</b>${esc(vname(it.k))}: ${esc(this.def(it.k))}</div>
        <div class="row end"><button class="btn primary" type="button" data-act="next">${S.i + 1 < S.items.length ? "Next →" : "Finish matching"}</button></div>` : ""}
      </div></div>`;
    if (done) view.querySelector('[data-act="next"]').focus();
  },
  grade(r, txt){
    const t = " " + txt.toLowerCase().replace(/[^a-z\s-]/g, " ").replace(/\s+/g, " ") + " ";
    const missing = r.need.filter(alts => !alts.some(a => t.includes(" " + a + " ") || t.includes(" " + a + "s ") || (a.includes(" ") && t.includes(a))));
    return missing;
  },
  recallView(){
    return `<div class="panel stack"><p class="muted">Type each definition the way you learned it in class. The check looks for the key words, so small wording differences are fine.</p>
      ${RECALL.map(r => { const v = S.recall[r.k] || ""; const miss = S.checked ? this.grade(r, v) : null;
        return `<div class="recall ${r.k === "vir" ? "" : "v-" + r.k}">
          <label class="fl" for="rc-${r.k}">${esc(r.n)}<input type="text" id="rc-${r.k}" data-rk="${r.k}" value="${esc(v)}" autocomplete="off" spellcheck="false"></label>
          ${S.checked ? (gated() && GATES.recallNeedsAttempt && wc(v) < 2 ? `<p class="miss">Write your answer first; the class definition shows after you try.</p>` : miss.length === 0 ? `<p class="ok">✓ All the key words are there.</p>` : `<p class="miss">Missing: ${miss.map(m => esc(m[0])).join(", ")}. Class definition: <b>${esc(r.ans)}</b></p>`) : ""}
        </div>`; }).join("")}
      <div class="row between"><button class="btn" type="button" data-act="clear">Clear and try again</button><button class="btn primary" type="button" data-act="check">Check my definitions</button></div></div>`;
  },
  click(act, el){
    if (act === "stage") { S.stage = el.dataset.v === "match" && S.stage === "done" ? "done" : el.dataset.v; if (el.dataset.v === "match" && S.i >= S.items.length - 1 && S.picked !== null) S.stage = "done"; }
    if (act === "again") this.newRound();
    if (act === "pick" && S.picked === null) { S.picked = el.dataset.k; if (S.picked === S.items[S.i].k) S.score++; }
    if (act === "next") { if (S.i + 1 < S.items.length) { S.i++; S.picked = null; } else { S.stage = "done"; P.defsBest = Math.max(P.defsBest ?? 0, S.score); saveP(); } }
    if (act === "check") { S.checked = true; const ok = RECALL.filter(r => this.grade(r, S.recall[r.k] || "").length === 0).length; P.recallBest = Math.max(P.recallBest ?? 0, ok); saveP(); }
    if (act === "clear") { S.recall = {}; S.checked = false; }
    this.render();
  },
  input(e){ const k = e.target.dataset.rk; if (k) { S.recall[k] = e.target.value; } },
  key(e){ if (S.stage !== "match" || S.picked !== null) return; const n = "1234".indexOf(e.key); if (n < 0) return;
    const it = S.items[S.i]; const b = view.querySelectorAll('[data-act="pick"]')[n]; if (b) this.click("pick", b); }
};

function keysFor(list, t){
  if (!COMMONS.has(list)) { const df = {}; list.forEach(x => new Set(stemsOf(x.d)).forEach(w => { df[w] = (df[w] || 0) + 1; })); COMMONS.set(list, new Set(Object.keys(df).filter(w => df[w] > 6))); }
  const common = COMMONS.get(list), own = new Set(stemsOf(t.t));
  return [...new Set(stemsOf(t.d))].filter(w => !own.has(w) && !common.has(w));
}
function relGeneric(list, t, g, extra){
  const gs = new Set(stemsOf(g)), low = " " + (g || "").toLowerCase() + " ";
  return keysFor(list, t).some(k => gs.has(k)) || (extra || []).some(w => low.includes(w.length <= 4 ? " " + w : w));
}

/* ================= ROUTER ================= */
function route(){
  const name = location.hash.slice(1);
  const next = V[name] && !["home","landing"].includes(name) ? name : "landing";
  if (V.current && V[V.current] && V[V.current].stop && next !== V.current) V[V.current].stop();
  V.current = next;
  document.body.dataset.view = next;
  if (!["landing","unit1","unit2","unit3","teacher"].includes(next)) { P.unit = U2_VIEWS.includes(next) ? "u2" : U1_VIEWS.includes(next) ? "u1" : "u3"; saveP(); }
  const un = (P.unit || "u3").slice(1);
  $("#homeLink").hidden = ["landing","unit1","unit2","unit3","teacher"].includes(next);
  $("#homeLink").href = "#unit" + un;
  $("#homeLink").textContent = "All Unit " + un + " stations";
  if (V[next].init) V[next].init();
  V[next].render();
  window.scrollTo(0, 0);
}
view.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || !view.contains(el)) return;
  const v = V[V.current]; if (v.click) v.click(el.dataset.act, el, e);
});
view.addEventListener("change", e => {
  const el = e.target.closest('input[type="checkbox"][data-act]'); if (!el) return;
  e.stopPropagation();
});
view.addEventListener("input", e => { const v = V[V.current]; if (v.input) v.input(e); });
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const v = V[V.current]; if (v && v.key) v.key(e);
});
window.addEventListener("hashchange", route);
route();
